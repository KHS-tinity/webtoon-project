<!DOCTYPE html>
<html lang="ko">
<head>
    <script>
        window.addEventListener('error', function(e) {
            const errorDiv = document.createElement('div');
            errorDiv.style.position = 'fixed';
            errorDiv.style.top = '0';
            errorDiv.style.left = '0';
            errorDiv.style.width = '100%';
            errorDiv.style.backgroundColor = '#ef4444';
            errorDiv.style.color = '#ffffff';
            errorDiv.style.padding = '1rem';
            errorDiv.style.zIndex = '999999';
            errorDiv.style.fontSize = '14px';
            errorDiv.style.fontFamily = 'monospace';
            errorDiv.style.whiteSpace = 'pre-wrap';
            errorDiv.innerHTML = '<strong>[JS Runtime Error]</strong> ' + e.message + '<br>Line: ' + e.lineno + ' | Col: ' + e.colno + '<br>File: ' + e.filename + (e.error && e.error.stack ? '<br><br>' + e.error.stack.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '');
            document.body.appendChild(errorDiv);
        });
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>시네마틱 웹툰 사운드 뷰어 Runtime</title>
    <!-- Google Fonts & Pretendard CDN -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient-start: #0f172a;
            --bg-gradient-end: #020617;
            --device-bg: #1e293b;
            --glow-color: rgba(99, 102, 241, 0.15);
            --bubble-text-color: #111827;
            --accent-color: #6366f1;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            color: #f8fafc;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 입체감 있는 외곽 광채 모바일 프레임 */
        .viewport-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .device-glow {
            position: absolute;
            top: -20px; left: -20px; right: -20px; bottom: -20px;
            background: radial-gradient(circle, var(--glow-color) 0%, transparent 70%);
            z-index: -1;
            border-radius: 3.5rem;
            filter: blur(15px);
            pointer-events: none;
        }

        .mobile-frame {
            width: 360px;
            height: 740px;
            background-color: #1e293b;
            border-radius: 3rem;
            box-shadow: 
                0 0 0 12px #1e293b, 
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                inset 0 0 20px rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.08);
        }

        /* 아이폰 스타일 상단 아일랜드 노치 */
        .mobile-frame::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 28px;
            background-color: #0f172a;
            border-radius: 14px;
            z-index: 100;
            pointer-events: none;
            box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.1);
        }

        /* 런타임 스냅 스크롤 캔버스 */
        .viewer-scroll-container {
            width: 100%;
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            background-color: #090d16;
        }
        .viewer-scroll-container::-webkit-scrollbar {
            display: none;
        }

        .viewer-cut-item {
            width: 100%;
            height: 100%;
            flex-shrink: 0;
            position: relative;
            scroll-snap-align: start;
            overflow: hidden;
            background-color: #0f172a;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.8);
            transition: transform 0.5s ease;
        }

        .cut-bg-image, .cut-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            pointer-events: none;
            object-fit: cover; /* WebM 비디오 자동 비율 크기 채우기 대응 */
        }

        .cut-bg-image {
            z-index: 1;
        }

        /* 60fps GPU 가속 연출 필터 및 트랜지션 정의 */
        .cut-bg-image.effect-fade, .cut-layer.effect-fade {
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .viewer-cut-item.active .cut-bg-image.effect-fade,
        .viewer-cut-item.active .cut-layer.effect-fade {
            opacity: 1;
        }

        .cut-bg-image.effect-slide-up, .cut-layer.effect-slide-up {
            transform: translateY(120px);
            opacity: 0;
            transition: transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.8s ease;
        }
        .viewer-cut-item.active .cut-bg-image.effect-slide-up,
        .viewer-cut-item.active .cut-layer.effect-slide-up {
            transform: translateY(0);
            opacity: 1;
        }

        .cut-bg-image.effect-zoom, .cut-layer.effect-zoom {
            transform: scale(1.35);
            opacity: 0;
            transition: transform 1.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 1s ease;
        }
        .viewer-cut-item.active .cut-bg-image.effect-zoom,
        .viewer-cut-item.active .cut-layer.effect-zoom {
            transform: scale(1);
            opacity: 1;
        }

        .viewer-cut-item.effect-shake.active {
            animation: viewerShake 0.6s cubic-bezier(.36,.07,.19,.97) both;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            perspective: 1000px;
        }

        @keyframes viewerShake {
            10%, 90% { transform: translate3d(-4px, -3px, 0); }
            20%, 80% { transform: translate3d(6px, 5px, 0); }
            30%, 50%, 70% { transform: translate3d(-11px, 3px, 0); }
            40%, 60% { transform: translate3d(11px, -5px, 0); }
        }

        /* 말풍선 공통 스타일 */
        .bubble-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .speech-bubble {
            position: absolute;
            max-width: 75%;
            padding: 0.9rem 1.35rem;
            border-radius: 1.35rem;
            font-size: 1.05rem;
            font-weight: 700;
            line-height: 1.5;
            word-break: keep-all;
            transform: scale(0.6) translateY(20px);
            opacity: 0;
            z-index: 10;
            color: var(--bubble-text-color);
            background-color: transparent;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
        }

        .bubble-text-layer {
            position: relative;
            z-index: 10;
            pointer-events: none;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .bubble-shadow-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: inherit;
            z-index: -2;
            pointer-events: none;
        }

        .speech-bubble.animate {
            opacity: 0;
            transform: scale(0.6) translateY(20px);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease, left 0.3s ease, top 0.3s ease;
        }

        .speech-bubble.animate .tail-svg,
        .speech-bubble.animate .bubble-path {
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .speech-bubble.show {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .speech-bubble.show .tail-svg,
        .speech-bubble.show .bubble-path {
            opacity: 1;
        }

        .typing-wrapper span {
            opacity: 0;
            display: inline;
        }

        .tail-svg {
            position: absolute;
            top: -500px;
            left: -500px;
            width: 1000px;
            height: 1000px;
            pointer-events: none;
            z-index: 3;
        }

        .bubble-bg-cover {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: inherit;
            background-color: var(--bubble-color, #ffffff);
            border: 2.5px solid #111827;
            box-sizing: border-box;
            z-index: 2;
            pointer-events: none;
        }

        /* 글래스모피즘 오디오 락 해제 안내 인트로 레이어 */
        .intro-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 500;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .intro-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 2.2rem 1.8rem;
            border-radius: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 290px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: scale(0.95);
            animation: cardEntrance 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes cardEntrance {
            to { transform: scale(1); }
        }

        .intro-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            filter: drop-shadow(0 4px 10px rgba(99, 102, 241, 0.4));
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        .intro-title {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
            letter-spacing: -0.01em;
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
        }

        .intro-desc {
            font-size: 0.88rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            word-break: keep-all;
        }

        .intro-btn {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
            padding: 0.8rem 1.6rem;
            border-radius: 1rem;
            font-size: 0.95rem;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .intro-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(99, 102, 241, 0.5);
        }

        .intro-badge {
            font-size: 0.7rem;
            font-weight: 800;
            color: #6366f1;
            background: rgba(99, 102, 241, 0.15);
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            margin-bottom: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* 하단 오토플레이 안내 플로터 */
        .viewer-floater {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.75rem;
            font-weight: 700;
            color: #94a3b8;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .floater-dot {
            width: 6px;
            height: 6px;
            background-color: #22c55e;
            border-radius: 50%;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

        /* 프리미엄 BGM 토글 버튼 스타일 */
        .bgm-toggle-btn {
            position: absolute;
            top: 52px;
            left: 20px;
            width: 38px;
            height: 38px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.1rem;
            cursor: pointer;
            z-index: 450;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .bgm-toggle-btn:hover {
            transform: scale(1.08);
            background: rgba(15, 23, 42, 0.85);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.3);
        }
        .bgm-toggle-btn.muted {
            border-color: rgba(239, 68, 68, 0.4);
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body>

        // 로컬 파일 시스템 구동 시 CORS 에러 완충용 프리미엄 기본 시네마틱 폴백 데이터

        // 로컬 웹 서버 실행 안내 모달 및 배너 연출
        function showLocalServerGuide() {
            if (document.getElementById('localServerGuideBanner')) return;

            const banner = document.createElement('div');
            banner.id = 'localServerGuideBanner';
            banner.style.position = 'absolute';
            banner.style.top = '100px'; // BGM 버튼과 겹치지 않게 노치 아래쪽으로 위치 하강

            banner.style.transform = 'translateX(-50%)';
            banner.style.width = '90%';
            banner.style.maxWidth = '320px';
            banner.style.background = 'rgba(15, 23, 42, 0.95)'; // 프리미엄 다크 유리모피즘 배경

            banner.style.display = 'flex';
            banner.style.flexDirection = 'column';
            banner.style.gap = '0.6rem';
            banner.style.transition = 'all 0.3s ease';

            banner.innerHTML = `
                <div style="display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 0.5rem; margin-bottom: 0.2rem;">
                    <div style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.82rem; font-weight: 800; color: #a5b4fc;">
                        <span>ℹ️ 로컬 파일(CORS 제한) 모드</span>
                    </div>
                </div>
                <p style="margin: 0; font-size: 0.72rem; color: #cbd5e1; line-height: 1.5; text-align: left; word-break: keep-all;">
                    브라우저 CORS 제한으로 기본 폴백 데이터로 구동 중입니다. 직접 편집기에서 저장(내보내기)한 <strong>data.json</strong> 또는 <strong>JSON 파일</strong>을 아래 버튼을 통해 바로 불러와 감상하실 수 있습니다!
                </p>
                <div style="display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.3rem;">
                    <input type="file" id="localJsonFileInput" accept=".json" style="display: none;">
                    <button id="selectLocalJsonBtn" style="background: linear-gradient(135deg, #6366f1, #4f46e5); border: none; color: #ffffff; border-radius: 8px; padding: 0.5rem; font-size: 0.72rem; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(99,102,241,0.25); display: flex; align-items: center; justify-content: center; gap: 0.3rem;">
                        📁 직접 내보낸 JSON 파일 불러오기
                    </button>
                    <button id="showGuideBtn" style="background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); color: #e2e8f0; border-radius: 8px; padding: 0.4rem; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: all 0.2s;">
                        🌐 로컬 웹 서버 구동방법 확인
                    </button>

        // 전체 초기화 래퍼 함수
        // 뷰어 전용 selectCut 함수 정의
        function selectCut(cutId, smoothScroll = true) {
            try {
                // 0번 가상 더미 컷과 1번 실제 컷 인덱스 분기 매핑
                if (cutId === 0 && cutsData && cutsData.length > 0) {
                    cutId = cutsData[0].id; // "cut_dummy_init"
                } else if (cutId === 1 && cutsData && cutsData.length > 1) {
                    cutId = cutsData[1].id; // 실제 첫 컷
                } else if (cutId === 1 && cutsData && cutsData.length > 0) {
                    cutId = cutsData[0].id; // 백업
                }

                // 0번 컷(초기화 가상 컷) 진입 시 모든 기존 미디어 및 말풍선 소거 (잔상 제거)
                if (cutId === "cut_dummy_init") {
                    document.querySelectorAll('.viewer-cut-item').forEach(cutItem => {
                        cutItem.querySelectorAll('.cut-layer, .cut-bg-image').forEach(layer => {
                            if (layer.tagName === 'VIDEO') {
                                try {
                                    layer.pause();
                                    layer.src = "";
                                    layer.load();
                                } catch(e) {}
                            }
                            layer.remove();
                        });
                        const bubbleContainer = cutItem.querySelector('.bubble-container');
                        if (bubbleContainer) {
                            bubbleContainer.innerHTML = '';
                        }
                    });
                    console.log("[Engine Reset] Cleared all layers and bubbles for dummy init cut");
                }

                const targetItem = document.getElementById(`viewerCut_${cutId}`);
                if (targetItem) {
                    // 컷 변경 시마다 requestAnimationFrame을 사용하여 강제 Reflow 유도
                    requestAnimationFrame(() => {
                        void targetItem.offsetHeight;
                        void viewerScrollContainer.offsetHeight;
                    });

                    if (smoothScroll && typeof animateScrollTo === 'function') {
                        animateScrollTo(targetItem.offsetTop, 600, () => {
                            window.lastSettledCutId = cutId;
                            window.currentCutId = cutId;
                            if (typeof window.handleScrollUpdate === 'function') {
                                window.handleScrollUpdate();
                            }
                        });
                    } else {
                        window.isSyncScrolling = true;
                        viewerScrollContainer.scrollTop = targetItem.offsetTop;
                        window.lastSettledCutId = cutId;
                        window.currentCutId = cutId;
                        if (typeof window.handleScrollUpdate === 'function') {
                            window.handleScrollUpdate();
                        }
                        setTimeout(() => {
                            window.isSyncScrolling = false;
                        }, 50);
                    }
                }
                
                // Canvas 강제 갱신용 updateCanvas 호출 (폴백 가드 적용)
                if (typeof window.updateCanvas === 'function') {
                    window.updateCanvas();
                } else if (typeof updateCanvas === 'function') {
                    updateCanvas();
                }
            } catch (err) {
                console.error("[Viewer selectCut Error]", err);
            }
        }
        window.selectCut = selectCut;

        // 전체 초기화 래퍼 함수 (동기 DOM 빌드)

            if (cutsData.length > 0) {
                window.currentCutId = cutsData[0].id;

                            });
                        }
                    });

            }
        }

                if (!res.ok) throw new Error("data.json 로드 실패");
                
                const rawData = await res.json();
                
                // 데이터 어댑터 가동: 프로퍼티 스키마 매핑 및 리소스 상대 경로 일괄 정규화 완료

            } catch (err) {
                console.warn("로컬 환경 파일 시스템(CORS 제한) 우회: 폴백 데이터로 기동합니다.", err);
                showLocalServerGuide();
                
                // 폴백 데이터 매핑 및 정규화
                const normalizedFallback = window.normalizeAndMapProjectData(fallbackData);
                initializeViewer(normalizedFallback);
                
                if (cutsData.length > 0) {

        // viewer DOM 동적 빌더 (플레이스홀더만 생성하여 Lazy Rendering 보장)
        function buildViewerDOM(data) {
            viewerScrollContainer.innerHTML = '';
            
            data.cuts.forEach((c, idx) => {
                const cutItem = document.createElement('div');
                cutItem.className = 'viewer-cut-item';
                cutItem.id = `viewerCut_${c.id}`;
                cutItem.dataset.cutId = c.id;

                }

                // 말풍선 담을 버블 컨테이너
                const bubbleContainer = document.createElement('div');
                bubbleContainer.className = 'bubble-container';
                bubbleContainer.id = `bubbleContainer_${c.id}`;
                
                cutItem.appendChild(bubbleContainer);
                viewerScrollContainer.appendChild(cutItem);
            });

        // 명암 대비 색상 계산기 (Contrast YIQ)
        function getContrastYIQ(hexcolor){
            if(!hexcolor) return '#111827';
            hexcolor = hexcolor.replace("#", "");
            var r = parseInt(hexcolor.substr(0,2),16);
            var g = parseInt(hexcolor.substr(2,2),16);
            var b = parseInt(hexcolor.substr(4,2),16);
            var yiq = ((r*299)+(g*587)+(b*114))/1000;
            return (yiq >= 128) ? '#111827' : '#ffffff'; 
        }

        // [수학적 말꼬리 SVG 그리기] 둥근 사각형 경계면 교점 기반 법선 벡터
        function updateTailRuntime(bubble, baseAngle, tipDx, tipDy, baseWidth) {
            if (!bubble) return;
            const pathFill = bubble.querySelector('.bubble-path-fill');
            const pathStroke = bubble.querySelector('.bubble-path-stroke');
            if (!pathFill || !pathStroke) return;

            const bw = bubble.offsetWidth;
            const bh = bubble.offsetHeight;
            const cx = 500 + bw / 2;
            const cy = 500 + bh / 2;
            
            const rad = (baseAngle || 45) * Math.PI / 180;
            const dx = Math.cos(rad);
            const dy = Math.sin(rad);
            
            const tx = cx + (tipDx || 30);
            const ty = cy + (tipDy || 30);
            
            const halfW = bw / 2;
            const halfH = bh / 2;

            // [1] 말풍선 둥근 모서리(border-radius) 동적 파싱
            const computedStyle = window.getComputedStyle(bubble);
            const borderRadius = parseFloat(computedStyle.borderRadius) || 20;
            const R = Math.min(borderRadius, halfW, halfH); // 버그 예방용 클램프

            // 가상 직사각형 교점
            const tv = halfW / Math.max(0.0001, Math.abs(dx));
            const th = halfH / Math.max(0.0001, Math.abs(dy));
            const tRect = Math.min(tv, th);
            const rx = tRect * dx;
            const ry = tRect * dy;

            let bx_norm, by_norm;
            const borderX = halfW - R;
            const borderY = halfH - R;

            // [2] 둥근 모서리 원호 방정식을 활용한 초정밀 접점 기하 연산
            if (rx > borderX && ry < -borderY) {
                // 우상 모서리 원호
                const cxCorner = borderX;
                const cyCorner = -borderY;
                const b = dx * cxCorner + dy * cyCorner;
                const c = cxCorner * cxCorner + cyCorner * cyCorner - R * R;
                const tCorner = b + Math.sqrt(Math.max(0, b * b - c));
                bx_norm = tCorner * dx;
                by_norm = tCorner * dy;
            } else if (rx > borderX && ry > borderY) {
                // 우하 모서리 원호
                const cxCorner = borderX;
                const cyCorner = borderY;
                const b = dx * cxCorner + dy * cyCorner;
                const c = cxCorner * cxCorner + cyCorner * cyCorner - R * R;
                const tCorner = b + Math.sqrt(Math.max(0, b * b - c));
                bx_norm = tCorner * dx;
                by_norm = tCorner * dy;
            } else if (rx < -borderX && ry < -borderY) {
                // 좌상 모서리 원호
                const cxCorner = -borderX;
                const cyCorner = -borderY;
                const b = dx * cxCorner + dy * cyCorner;
                const c = cxCorner * cxCorner + cyCorner * cyCorner - R * R;
                const tCorner = b + Math.sqrt(Math.max(0, b * b - c));
                bx_norm = tCorner * dx;
                by_norm = tCorner * dy;
            } else if (rx < -borderX && ry > borderY) {
                // 좌하 모서리 원호
                const cxCorner = -borderX;
                const cyCorner = borderY;
                const b = dx * cxCorner + dy * cyCorner;
                const c = cxCorner * cxCorner + cyCorner * cyCorner - R * R;
                const tCorner = b + Math.sqrt(Math.max(0, b * b - c));
                bx_norm = tCorner * dx;
                by_norm = tCorner * dy;
            } else {
                // 가로/세로 평평한 경계면
                bx_norm = rx;
                by_norm = ry;
            }

            const finalWidth = (baseWidth !== undefined && baseWidth !== null) ? parseFloat(baseWidth) : 14; 
            
            // [4] 경계면 정합에 따른 base 오프셋 px, py 계산
            let px, py;
            if (tv < th) {
                // 세로 경계선 교점 -> 세로 방향으로만 오프셋
                px = 0;
                py = Math.sign(dx || 1) * (finalWidth / 2);
            } else if (th < tv) {
                // 가로 경계선 교점 -> 가로 방향으로만 오프셋
                px = -Math.sign(dy || 1) * (finalWidth / 2);
                py = 0;
            } else {
                // 모서리 원호 교점 -> 법선 방향 오프셋
                px = -dy * (finalWidth / 2);
                py = dx * (finalWidth / 2);
            }

            let bx_stroke = cx + bx_norm;
            let by_stroke = cy + by_norm;
            const bx1_stroke = bx_stroke + px;
            const by1_stroke = by_stroke + py;
            const bx2_stroke = bx_stroke - px;
            const by2_stroke = by_stroke - py;
            const cpx_stroke = bx_stroke + (tx - bx_stroke) * 0.35;
            const cpy_stroke = by_stroke + (ty - by_stroke) * 0.35;

            // [3] 테두리용(Stroke) 패스: 0px 침투 (완벽히 모서리 경계에서 시작), fill: none
            const d_stroke = `M ${bx1_stroke} ${by1_stroke} Q ${cpx_stroke} ${cpy_stroke} ${tx} ${ty} Q ${cpx_stroke} ${cpy_stroke} ${bx2_stroke} ${by2_stroke}`;
            pathStroke.setAttribute('d', d_stroke);

            // [3] 채우기용(Fill) 패스: Stroke와 100% 동일한 곡선을 사용하되, 안쪽으로 8px 확장 영역을 덧붙임
            const bx1_in = bx1_stroke - dx * 8;
            const by1_in = by1_stroke - dy * 8;
            const bx2_in = bx2_stroke - dx * 8;
            const by2_in = by2_stroke - dy * 8;
            const d_fill = `M ${bx1_stroke} ${by1_stroke} Q ${cpx_stroke} ${cpy_stroke} ${tx} ${ty} Q ${cpx_stroke} ${cpy_stroke} ${bx2_stroke} ${by2_stroke} L ${bx2_in} ${by2_in} L ${bx1_in} ${by1_in} Z`;
            pathFill.setAttribute('d', d_fill);

            // [6] 말꼬리 가림막 레이어(.bubble-bg-cover) 실시간 배경색 싱크 보강
            const bgCover = bubble.querySelector('.bubble-bg-cover');
            if (bgCover) {
                bgCover.style.backgroundColor = bubble.style.getPropertyValue('--bubble-color') || '#ffffff';
            }
        }

        // [글로벌 BGM 런타임 최적화 동기화 제어 함수]
        function syncGlobalBgmsRuntime(cutIndex) {
            if (!isWebAudioInitialized) return;

            // data.json 의 글로벌 bgms 설정을 파싱하여 로드
            if (Object.keys(activeBgms).length === 0 && window.cutsData) {
                // 최초 1회 activeBgms 맵 동적 초기화
                const bgmDataList = window.cutsDataListBgms || []; 
                // data.json 에 들어있는 bgms 배열을 직접 로드할 수 있도록 전역 대입
            }

            const bgmsArray = window.bgmsDataListGlobal || [];
            
            bgmsArray.forEach(b => {
                const cardId = b.id;
                const inRange = cutIndex >= b.startCut && cutIndex <= b.endCut;

                if (!activeBgms[cardId]) {
                    const audio = new Audio(normalizeMediaPath(b.audioUrl));
                    audio.autoplay = false;
                    audio.loop = true;
                    audio.load();
                    
                    // 루프백 명시적 Fail-safe 복귀
                    audio.addEventListener('ended', () => {
                        if (audio.loop && activeBgms[cardId] && activeBgms[cardId].isPlaying) {
                            audio.currentTime = activeBgms[cardId].startTime;
                            audio.play().catch(e => console.log("Runtime Loop Error:", e));
                        }
                    });

                    // viewer.js에 이식되어 있는 오디오 파이프에 노드 체인 연결
                    if (window.audioPipeManager) {
                        window.audioPipeManager.connectAudio(audio, 'bgm');
                    }
                    
                    activeBgms[cardId] = {
                        audio: audio,
                        audioUrl: normalizeMediaPath(b.audioUrl),
                        startCut: b.startCut,
                        endCut: b.endCut,
                        startTime: b.startTime,
                        isPlaying: false
                    };
                }

                const track = activeBgms[cardId];
                if (inRange) {
                    if (!track.isPlaying) {
                        track.isPlaying = true;
                        
                        if (track.audio.fadeTimer) {
                            clearInterval(track.audio.fadeTimer);
                            track.audio.fadeTimer = null;
                        }

                        track.audio.currentTime = track.startTime;
                        track.audio.volume = 0;
                        
                        track.audio.play().then(() => {
                            fadeAudioRuntime(track.audio, 0, 0.25, 1000);
                            
                            // 배경음악과 화면 렌더링 동기화
                            window.isFirstCutReady = true;
                            if (typeof window.renderItemsFrame === 'function') {
                                window.renderItemsFrame();
                            }
                        }).catch(e => {
                            console.log("BGM 자동 재생 블로킹 우회대기:", e);
                            track.isPlaying = false;
                        });
                    }
                } else {
                    if (track.isPlaying) {
                        track.isPlaying = false;
                        const audioToFade = track.audio;
                        fadeAudioRuntime(audioToFade, audioToFade.volume, 0, 1000, () => {
                            audioToFade.pause();
                            audioToFade.currentTime = track.startTime;
                        });
                    }
                }
            });
        }

        // BGM 전용 페이드 아웃/인 런타임 함수
        function fadeAudioRuntime(audio, startVol, endVol, durationMs, onComplete) {
            if (audio.fadeTimer) {
                clearInterval(audio.fadeTimer);
                audio.fadeTimer = null;
            }
            
            const steps = 20;
            const interval = durationMs / steps;
            const volStep = (endVol - startVol) / steps;
            let currentStep = 0;
            
            audio.volume = startVol;
            
            audio.fadeTimer = setInterval(() => {
                currentStep++;
                let nextVol = startVol + volStep * currentStep;
                if (nextVol < 0) nextVol = 0;
                if (nextVol > 1) nextVol = 1;
                audio.volume = nextVol;
                
                if (currentStep >= steps) {
                    clearInterval(audio.fadeTimer);
                    audio.fadeTimer = null;
                    audio.volume = endVol;
                    if (onComplete) onComplete();
                }
            }, interval);
        }

        // 글로벌 BGM 데이터는 DOMContentLoaded 시점에 data.json 으로부터 단일 스트림으로 완전 병합 바인딩 완료됨.

        // ================= 스크롤 속도 계산, 가속 제어 및 양방향 진행 방향 감지 변수들 =================
        var lastScrollTop = 0;
        var lastScrollTime = performance.now();
        var scrollEndTimeout = null;
        var decelAnimId = null;

        function decelerateMultiplier() {
            if (window.isFastForwarding) return; 
            if (window.speedMultiplier > 1.0) {
                window.speedMultiplier -= 0.15; 
                if (window.speedMultiplier < 1.0) window.speedMultiplier = 1.0;
                if (typeof window.updatePlayingAudiosPlaybackRate === 'function') {
                    window.updatePlayingAudiosPlaybackRate();
                }
                decelAnimId = requestAnimationFrame(decelerateMultiplier);
            } else {
                window.speedMultiplier = 1.0;
                if (typeof window.updatePlayingAudiosPlaybackRate === 'function') {
                    window.updatePlayingAudiosPlaybackRate();
                }
            }
        }

        // 뷰어 스크롤 감지 및 제어 연동
        viewerScrollContainer.addEventListener('scroll', () => {
            if (cutsData.length === 0) return;

            if (window.isFastForwarding) {
                lastScrollTop = viewerScrollContainer.scrollTop;
                return;
            }
            
            const now = performance.now();
            const scrollTop = viewerScrollContainer.scrollTop;
            const dt = now - lastScrollTime;
            
            if (dt > 10) {
                const dy = Math.abs(scrollTop - lastScrollTop);
                const scrollVelocity = dy / dt; // px/ms
                
                if (decelAnimId) {
                    cancelAnimationFrame(decelAnimId);
                    decelAnimId = null;
                }
                
                window.speedMultiplier = 1.0 + Math.min(5.0, scrollVelocity * 2.5);
                if (typeof window.updatePlayingAudiosPlaybackRate === 'function') {
                    window.updatePlayingAudiosPlaybackRate();
                }
                
                lastScrollTime = now;
            }

            window.isScrollDirectionDown = scrollTop >= lastScrollTop;
            lastScrollTop = scrollTop;

            clearTimeout(scrollEndTimeout);
            scrollEndTimeout = setTimeout(function checkScrollEnd() {
                const scrollTop = viewerScrollContainer.scrollTop;
                const containerHeight = viewerScrollContainer.clientHeight || 740;
                
                const targetCutIdx = Math.round(scrollTop / containerHeight);
                const targetScrollTop = targetCutIdx * containerHeight;
                
                if (Math.abs(scrollTop - targetScrollTop) > 3) {
                    scrollEndTimeout = setTimeout(checkScrollEnd, 50);
                    return;
                }
                
                if (!window.isSyncScrolling) {
                    const activeCut = cutsData[targetCutIdx];
                    if (activeCut) {
                        const settledCutId = activeCut.id;
                        
                        if (settledCutId !== window.lastSettledCutId) {
                            // [원자적 상태 리셋] 스레드 1프레임 렌더링에 의한 대사 번쩍임(Flash) 현상을 완전히 원천 봉쇄합니다.
                            window.isTimeBasedAutoplay = true;
                            window.accumulatedTime = 0.0;
                            
                            window.lastSettledCutId = settledCutId;
                            window.currentCutId = settledCutId;
                            
                            if (typeof window.triggerAutoplayForCurrentCut === 'function') {
                                window.triggerAutoplayForCurrentCut();
                            }
                        } else {
                            if (!window.isTimeBasedAutoplay) {
                                if (typeof window.restoreEditMode === 'function') {
                                    window.restoreEditMode();
                                }
                            }
                        }
                    }
                }
            }, 150);

            if (typeof window.handleScrollUpdate === 'function') {
                window.handleScrollUpdate();
            }
        });

        // 물리 인터랙션 발생 시 자동 재생 중지
        function handleUserDirectInteraction() {
            // 400ms 미세 관성 및 사용자 터치 해제 잔여 이벤트 락아웃 가드
            if (performance.now() - (window.autoplayStartTime || 0) < 400) {
                return;
            }
            if (window.isTimeBasedAutoplay && !window.isProgrammaticPlaying) {
                if (typeof window.restoreEditMode === 'function') {
                    window.restoreEditMode();
                }
                console.log("⏹ 수동 조작으로 연출이 중지되었습니다.");
            }
        }
        
        viewerScrollContainer.addEventListener('wheel', handleUserDirectInteraction, { passive: true });
        viewerScrollContainer.addEventListener('touchstart', handleUserDirectInteraction, { passive: true });
        viewerScrollContainer.addEventListener('mousedown', (e) => {
            if (e.target === viewerScrollContainer) {
                handleUserDirectInteraction();
            }
        });

        // 모바일 바운스 스크롤 방어: viewerScrollContainer 내부 이외 영역의 터치 무브를 차단하여 화면 흔들림 방지
        document.addEventListener('touchmove', function(e) {
            if (!e.target.closest('#viewerScrollContainer')) {
                e.preventDefault();
            }
        }, { passive: false });

        // ================= 사용자 최초 인터랙션 및 오디오 컨텍스트 락킹 해제 =================
        function startCinematicViewer() {
            if (isWebAudioInitialized) return;
            isWebAudioInitialized = true;
            window.isAutoplayPending = false;

            // User Gesture Unlock: 더미 무음 오디오를 터치 스택 내에서 재생 시도하여 모바일 오디오 락 해제
            const dummyAudio = new Audio();
            dummyAudio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==";
            dummyAudio.play().then(() => {
                dummyAudio.pause();
            }).catch(e => console.log("Audio unlock dummy play bypass:", e));

            // 1. Web Audio API 초기화 강제 트리거
            if (window.audioPipeManager) {
                window.audioPipeManager.init();
                if (window.audioPipeManager.ctx && window.audioPipeManager.ctx.state === 'suspended') {
                    window.audioPipeManager.ctx.resume().catch(() => {});
                }
            }

            // 2. 인트로 오버레이 카드 미려하게 페이드아웃
            introOverlay.style.opacity = '0';
            setTimeout(() => {
                introOverlay.style.display = 'none';
            }, 600);

            // 3. 첫번째 컷 오토플레이 즉시 트리거
            if (cutsData.length > 0) {
                // 더미 컷이 있을 경우 실제 첫 번째 컷(index 1)을 타겟으로 함
                const firstCutId = cutsData.length > 1 ? cutsData[1].id : cutsData[0].id;
                window.currentCutId = firstCutId;
                window.lastSettledCutId = firstCutId;
                
                // BGM 동기화 개시
                syncGlobalBgmsRuntime(1);
                
                // 1컷 자동 재생 기동
                if (typeof window.triggerAutoplayForCurrentCut === 'function') {
                    window.triggerAutoplayForCurrentCut();
                }
            }
        }

        // 인트로 오버레이 클릭 또는 감상 시작 버튼 터치 시 기동
        introOverlay.addEventListener('click', startCinematicViewer);

        // ================= [빨리감기] Double-click/tap and Hold 제스처 처리 =================
        let lastMouseDownTime = 0;
        let lastTouchStartTime = 0;

        // 마우스 왼쪽 버튼 더블클릭 홀드 (웹/캔버스 환경)
        viewerScrollContainer.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return; // 왼쪽 클릭만
            const now = performance.now();
            if (now - lastMouseDownTime < 300) {
                window.isFastForwarding = true;
                window.speedMultiplier = 4.0;
                if (typeof window.updatePlayingAudiosPlaybackRate === 'function') {
                    window.updatePlayingAudiosPlaybackRate();
                }
                const floater = document.querySelector('.viewer-floater span');
                if (floater) floater.textContent = "⏩ 빨리 감기 진행 중 (4.0x)...";
            }
            lastMouseDownTime = now;
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button !== 0) return;
            if (window.isFastForwarding) {
                window.isFastForwarding = false;
                window.speedMultiplier = 1.0;
                if (typeof window.updatePlayingAudiosPlaybackRate === 'function') {
                    window.updatePlayingAudiosPlaybackRate();
                }
                const floater = document.querySelector('.viewer-floater span');
                if (floater) floater.textContent = "스크롤 또는 Hold 시 빨리 감기";
            }
        });

        // 스마트폰 터치 더블탭 홀드 (모바일/스마트폰 환경)
        viewerScrollContainer.addEventListener('touchstart', (e) => {
            const now = performance.now();
            if (now - lastTouchStartTime < 300) {
                window.isFastForwarding = true;
                window.speedMultiplier = 4.0;
                if (typeof window.updatePlayingAudiosPlaybackRate === 'function') {
                    window.updatePlayingAudiosPlaybackRate();
                }
                const floater = document.querySelector('.viewer-floater span');
                if (floater) floater.textContent = "⏩ 빨리 감기 진행 중 (4.0x)...";
            }
            lastTouchStartTime = now;
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (window.isFastForwarding) {
                window.isFastForwarding = false;
                window.speedMultiplier = 1.0;
                if (typeof window.updatePlayingAudiosPlaybackRate === 'function') {
                    window.updatePlayingAudiosPlaybackRate();
                }
                const floater = document.querySelector('.viewer-floater span');
                if (floater) floater.textContent = "스크롤 또는 Hold 시 빨리 감기";
            }
        });

        window.addEventListener('touchcancel', (e) => {
            if (window.isFastForwarding) {
                window.isFastForwarding = false;
                window.speedMultiplier = 1.0;
                if (typeof window.updatePlayingAudiosPlaybackRate === 'function') {
                    window.updatePlayingAudiosPlaybackRate();
                }
                const floater = document.querySelector('.viewer-floater span');
                if (floater) floater.textContent = "스크롤 또는 Hold 시 빨리 감기";
            }
        });

        // 수동 스크롤 조작에 따른 글로벌 BGM 동적 동기화 브릿지 매핑
        window.syncGlobalBgmsRuntime = syncGlobalBgmsRuntime;

    </script>
</body>

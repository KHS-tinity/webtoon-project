<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모션 웹툰 연출 편집기 (Motion Webtoon Editor)</title>
  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    :root {
      --bg-darker: #07080a;
      --bg-dark: #0f1115;
      --bg-panel: #161920;
      --border-panel: rgba(255, 255, 255, 0.08);
      --accent: #8b5cf6;
      --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 100%);
      --accent-glow: rgba(139, 92, 246, 0.4);
      --accent-light: #22d3ee;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --card-selected: rgba(139, 92, 246, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-darker);
      color: var(--text-light);
      font-family: 'Noto Sans KR', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Scrollbars styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-dark);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }

    /* Header Bar */
    header {
      background-color: var(--bg-dark);
      border-bottom: 1px solid var(--border-panel);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      background: var(--accent-gradient);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 10px var(--accent-glow);
    }
    .brand-logo span {
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 40%, var(--text-muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .project-title-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: var(--text-light);
      padding: 6px 12px;
      font-size: 0.9rem;
      width: 300px;
      transition: all 0.2s;
    }
    .project-title-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .actions-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-light);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .btn-primary {
      background: var(--accent-gradient);
      border-color: transparent;
      box-shadow: 0 4px 15px var(--accent-glow);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }
    .btn-primary:active {
      transform: translateY(0);
    }

    /* Main Grid Layout */
    .editor-layout {
      flex-grow: 1;
      display: grid;
      grid-template-columns: 240px 1fr 340px;
      grid-template-rows: 1fr 140px;
      overflow: hidden;
    }

    /* Sidebar Left: Cut Selector List */
    .sidebar-left {
      background-color: var(--bg-dark);
      border-right: 1px solid var(--border-panel);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .panel-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-panel);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-header h3 {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .cut-list {
      list-style: none;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cut-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-panel);
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.2s;
      position: relative;
    }
    .cut-card:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }
    .cut-card.selected {
      border-color: var(--accent);
      background-color: var(--card-selected);
      box-shadow: inset 0 0 10px rgba(139, 92, 246, 0.15);
    }

    .cut-card-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
    }
    .cut-card-title {
      font-weight: 700;
    }
    .cut-card-duration {
      color: var(--text-muted);
    }

    .cut-thumbnail {
      width: 100%;
      height: 80px;
      background: #000;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .cut-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .cut-thumbnail-placeholder {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .cut-card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }
    .cut-card-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px;
      border-radius: 4px;
      transition: all 0.1s;
    }
    .cut-card-btn:hover {
      color: var(--text-light);
      background: rgba(255, 255, 255, 0.08);
    }
    .cut-card-btn.delete:hover {
      color: #ef4444;
    }

    /* Center Section: Canvas Workspace */
    .workspace {
      background-color: var(--bg-darker);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    #canvas-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 440px;
      max-height: 700px;
      aspect-ratio: 9 / 16;
      background: #000;
      border: 2px dashed rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    #canvas-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
      pointer-events: none;
      transition: transform 0.2s ease-out;
    }

    #canvas-bubble-layer {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 5;
    }

    /* Draggable Bubble item inside canvas */
    .canvas-bubble {
      position: absolute;
      cursor: move;
      min-width: 80px;
      max-width: 200px;
      user-select: none;
      transition: box-shadow 0.2s;
    }
    .canvas-bubble:hover {
      box-shadow: 0 0 0 2px var(--accent);
    }
    .canvas-bubble.selected {
      box-shadow: 0 0 0 3px var(--accent-light), 0 10px 20px rgba(0,0,0,0.5);
    }

    .canvas-bubble-inner {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 500;
      line-height: 1.4;
      word-break: keep-all;
      border-style: solid;
      border-width: 2px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    /* Speech bubble visual layout overrides for canvas editor */
    .style-thought .canvas-bubble-inner { border-radius: 20px; }
    .style-shout .canvas-bubble-inner {
      clip-path: polygon(
        0% 15%, 12% 10%, 15% 0%, 25% 8%, 38% 3%, 45% 10%, 60% 0%, 65% 12%, 80% 5%, 85% 14%, 96% 8%, 92% 28%, 100% 40%, 91% 52%, 98% 70%, 86% 75%, 88% 94%, 73% 85%, 60% 98%, 52% 86%, 35% 92%, 30% 80%, 15% 90%, 18% 72%, 5% 75%, 8% 55%, 0% 45%, 9% 30%
      );
      padding: 18px 20px;
      border: none !important;
    }
    .style-modern .canvas-bubble-inner { border-radius: 8px; }
    .style-retro .canvas-bubble-inner { border-radius: 0; border-width: 3px; box-shadow: 4px 4px 0px #000; }

    /* Canvas Grid lines overlay (toggled) */
    .grid-lines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-size: 10% 10%;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }

    /* Sidebar Right: Properties Inspector Panel */
    .sidebar-right {
      background-color: var(--bg-dark);
      border-left: 1px solid var(--border-panel);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .properties-section {
      padding: 16px;
      border-bottom: 1px solid var(--border-panel);
    }

    .properties-section h4 {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-group {
      margin-bottom: 12px;
    }
    .form-group.inline {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    input, select, textarea {
      width: 100%;
      background-color: var(--bg-panel);
      border: 1px solid var(--border-panel);
      border-radius: 6px;
      color: var(--text-light);
      padding: 8px 12px;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }
    textarea {
      resize: vertical;
      min-height: 60px;
    }

    .bubble-pill-item {
      background: var(--bg-panel);
      border: 1px solid var(--border-panel);
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      transition: all 0.2s;
    }
    .bubble-pill-item:hover {
      border-color: rgba(255,255,255,0.15);
    }
    .bubble-pill-item.selected {
      border-color: var(--accent);
      background-color: var(--card-selected);
    }
    .bubble-pill-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 160px;
    }
    .bubble-pill-actions {
      display: flex;
      gap: 4px;
    }

    /* Bottom Timeline Area */
    .timeline-footer {
      grid-column: 1 / 4;
      background-color: var(--bg-dark);
      border-top: 1px solid var(--border-panel);
      display: flex;
      flex-direction: column;
      padding: 12px 24px;
      gap: 8px;
      z-index: 10;
    }

    .timeline-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
    }

    .timeline-track-container {
      position: relative;
      height: 48px;
      background: var(--bg-panel);
      border: 1px solid var(--border-panel);
      border-radius: 8px;
      display: flex;
      align-items: center;
    }

    .timeline-ticks {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      padding: 0 4px;
    }
    .timeline-tick-line {
      width: 1px;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      margin-top: auto;
      margin-bottom: 2px;
    }

    .timeline-marker-layer {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* Timeline Markers */
    .timeline-marker {
      position: absolute;
      width: 12px;
      height: 24px;
      background: var(--accent-light);
      border: 1px solid #fff;
      top: 12px;
      transform: translateX(-50%);
      border-radius: 3px;
      cursor: ew-resize;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
      transition: background-color 0.2s;
    }
    .timeline-marker:hover {
      background: #fff;
      box-shadow: 0 0 8px var(--accent-light);
    }
    .timeline-marker.selected {
      background: var(--accent);
      border-color: var(--accent-light);
      box-shadow: 0 0 10px var(--accent);
      z-index: 10;
    }

    .timeline-marker::after {
      content: '';
      position: absolute;
      top: 24px;
      left: 5px;
      width: 1px;
      height: 12px;
      background: rgba(6, 182, 212, 0.4);
    }

    /* Import/Export hidden file inputs */
    #file-import {
      display: none;
    }

    /* Audio list items */
    .audio-item {
      background: var(--bg-panel);
      border: 1px solid var(--border-panel);
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 8px;
      font-size: 0.8rem;
    }
    .audio-item-title {
      font-weight: bold;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <!-- Hidden Import File Input -->
  <input type="file" id="file-import" accept=".json">

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-logo">
        <span>N</span>
      </div>
      <div>
        <div class="brand-title">NAVIGATOR EDITOR</div>
      </div>
      <input type="text" class="project-title-input" id="project-title" value="대항해시대: 푸른 심연의 부름" placeholder="프로젝트 제목">
    </div>

    <div class="actions-group">
      <button class="btn" id="btn-reset-default" title="기본 리셋">
        <span class="material-icons-round">restore</span>
        기본값 복원
      </button>
      <button class="btn" id="btn-import" title="JSON 불러오기">
        <span class="material-icons-round">file_upload</span>
        가져오기
      </button>
      <button class="btn" id="btn-export" title="JSON 저장">
        <span class="material-icons-round">file_download</span>
        내보내기 (JSON)
      </button>
      <button class="btn btn-primary" id="btn-preview" title="뷰어에서 연출 미리보기">
        <span class="material-icons-round">play_circle_filled</span>
        뷰어 실행하기
      </button>
    </div>
  </header>

  <!-- Editor Body -->
  <div class="editor-layout">
    
    <!-- Left Sidebar: Cut lists -->
    <div class="sidebar-left">
      <div class="panel-header">
        <h3>컷 리스트 (Cuts)</h3>
        <button class="cut-card-btn" id="btn-add-cut" title="새 컷 추가">
          <span class="material-icons-round">add_box</span>
        </button>
      </div>
      <ul class="cut-list" id="cut-ul">
        <!-- Rendered dynamically -->
      </ul>
    </div>

    <!-- Center Workspace: Aspect Canvas -->
    <div class="workspace">
      <div id="canvas-container">
        <img id="canvas-bg" src="" alt="Cut Image preview">
        <div class="grid-lines"></div>
        <div id="canvas-bubble-layer">
          <!-- Rendered speech bubble shells inside canvas -->
        </div>
      </div>
    </div>

    <!-- Right Sidebar: Properties & Elements Inspector -->
    <div class="sidebar-right">
      
      <!-- Cut General Properties -->
      <div class="properties-section">
        <h4><span class="material-icons-round" style="font-size: 1rem;">photo</span>컷 기본 설정</h4>
        <div class="form-group">
          <label for="cut-bg-select">배경 이미지 파일</label>
          <select id="cut-bg-select">
            <option value="./자료/1.jpg">1.jpg (바다 노을)</option>
            <option value="./자료/2.jpg">2.jpg (거친 바다)</option>
            <option value="./자료/3.jpg">3.jpg (푸른 신대륙)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="cut-duration">연출 총 재생 시간 (ms)</label>
          <input type="number" id="cut-duration" value="5000" step="500">
        </div>
      </div>

      <!-- Camera Movement Configuration -->
      <div class="properties-section">
        <h4><span class="material-icons-round" style="font-size: 1rem;">videocam</span>카메라 움직임 (Ken Burns)</h4>
        <div class="form-group inline">
          <div>
            <label for="cam-start-scale">시작 확대 배율</label>
            <input type="number" id="cam-start-scale" value="1.0" step="0.05">
          </div>
          <div>
            <label for="cam-end-scale">종료 확대 배율</label>
            <input type="number" id="cam-end-scale" value="1.2" step="0.05">
          </div>
        </div>
        <div class="form-group inline">
          <div>
            <label for="cam-start-x">시작 위치 X (px)</label>
            <input type="number" id="cam-start-x" value="0">
          </div>
          <div>
            <label for="cam-start-y">시작 위치 Y (px)</label>
            <input type="number" id="cam-start-y" value="0">
          </div>
        </div>
        <div class="form-group inline">
          <div>
            <label for="cam-end-x">종료 위치 X (px)</label>
            <input type="number" id="cam-end-x" value="-10">
          </div>
          <div>
            <label for="cam-end-y">종료 위치 Y (px)</label>
            <input type="number" id="cam-end-y" value="-10">
          </div>
        </div>
        <div class="form-group inline">
          <div>
            <label for="cam-start-time">움직임 시작 (ms)</label>
            <input type="number" id="cam-start-time" value="0">
          </div>
          <div>
            <label for="cam-duration">움직임 시간 (ms)</label>
            <input type="number" id="cam-duration" value="5000">
          </div>
        </div>
      </div>

      <!-- Audio Triggers List -->
      <div class="properties-section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <h4 style="margin-bottom: 0;"><span class="material-icons-round" style="font-size: 1rem;">audiotrack</span>오디오 연출</h4>
          <button class="cut-card-btn" id="btn-add-audio" title="오디오 소스 추가">
            <span class="material-icons-round" style="font-size: 1.1rem;">add_circle</span>
          </button>
        </div>
        <div id="audio-list-container">
          <!-- Dynamically filled with audio items -->
        </div>
      </div>

      <!-- Speech Bubbles List & Custom Selected Properties -->
      <div class="properties-section" style="border-bottom: none; flex-grow: 1;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <h4 style="margin-bottom: 0;"><span class="material-icons-round" style="font-size: 1rem;">forum</span>대사 및 말풍선</h4>
          <button class="cut-card-btn" id="btn-add-bubble" title="새 말풍선 추가">
            <span class="material-icons-round" style="font-size: 1.1rem;">add_circle</span>
          </button>
        </div>

        <!-- Bubbles Pills -->
        <div id="bubbles-pills-list" style="margin-bottom: 12px;">
          <!-- Dynamically populated -->
        </div>

        <!-- Selected Bubble Inspector Form -->
        <div id="bubble-inspector" style="display: none; border-top: 1px dashed var(--border-panel); padding-top: 12px;">
          <div class="form-group">
            <label for="bubble-text">대사 내용</label>
            <textarea id="bubble-text" placeholder="말풍선 안에 들어갈 텍스트 대사"></textarea>
          </div>
          <div class="form-group inline">
            <div>
              <label for="bubble-start-time">등장 시작 시간 (ms)</label>
              <input type="number" id="bubble-start-time" value="1000" step="100">
            </div>
            <div>
              <label for="bubble-char-interval">글자 노출 속도 (ms)</label>
              <input type="number" id="bubble-char-interval" value="80" step="10">
            </div>
          </div>
          <div class="form-group inline">
            <div>
              <label for="bubble-style">말풍선 스타일</label>
              <select id="bubble-style">
                <option value="modern">Modern (글래스)</option>
                <option value="thought">Thought (생각)</option>
                <option value="shout">Shout (외침)</option>
                <option value="retro">Retro (레트로)</option>
              </select>
            </div>
            <div>
              <label for="bubble-color">텍스트 색상</label>
              <input type="color" id="bubble-color" value="#000000">
            </div>
          </div>
          <div class="form-group inline">
            <div>
              <label for="bubble-bg-color">배경 색상</label>
              <input type="color" id="bubble-bg-color" value="#ffffff">
            </div>
            <div>
              <label for="bubble-border-color">테두리 색상</label>
              <input type="color" id="bubble-border-color" value="#8b5cf6">
            </div>
          </div>
          <div class="form-group inline">
            <div>
              <label for="bubble-x">위치 X (%)</label>
              <input type="number" id="bubble-x" min="0" max="100" value="20">
            </div>
            <div>
              <label for="bubble-y">위치 Y (%)</label>
              <input type="number" id="bubble-y" min="0" max="100" value="20">
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- Bottom Timeline Track Selector -->
    <div class="timeline-footer">
      <div class="timeline-label">
        <span>현재 컷 말풍선 타임라인 (말풍선 타이밍 조절: 마커 가로 드래그)</span>
        <span id="timeline-duration-display">Duration: 7.0s</span>
      </div>
      <div class="timeline-track-container">
        <div class="timeline-ticks">
          <!-- 10 Ticks dynamically drawn -->
          <div class="timeline-tick-line"></div>
          <div class="timeline-tick-line"></div>
          <div class="timeline-tick-line"></div>
          <div class="timeline-tick-line"></div>
          <div class="timeline-tick-line"></div>
          <div class="timeline-tick-line"></div>
          <div class="timeline-tick-line"></div>
          <div class="timeline-tick-line"></div>
          <div class="timeline-tick-line"></div>
          <div class="timeline-tick-line"></div>
          <div class="timeline-tick-line"></div>
        </div>
        <div class="timeline-marker-layer" id="timeline-track">
          <!-- Bubble markers will render and drag here -->
        </div>
      </div>
    </div>

  </div>

  <script>
    // State Model
    let webtoonData = null;
    
    const state = {
      currentCutIndex: 0,
      selectedBubbleId: null,
      isDraggingBubble: false,
      draggedBubbleEl: null,
      dragStartX: 0,
      dragStartY: 0,
      bubbleStartPctX: 0,
      bubbleStartPctY: 0
    };

    // Predefined local assets
    const audioOptions = [
      { path: "./자료/Uncharted Waters - 01 Opening.mp3", label: "대항해시대2 오프닝 (BGM)" },
      { path: "./자료/대항해시대2 Ost - Menu Theme(AI).mp3", label: "대항해시대2 메뉴 (BGM)" },
      { path: "./자료/대항해시대2(1995)dos bgm.mp3", label: "대항해시대2 DOS 종합 (BGM)" },
      { path: "./자료/녹음.m4a", label: "효과음/대사 녹음 (SFX)" }
    ];

    // DOM Setup
    window.addEventListener("DOMContentLoaded", async () => {
      await loadInitialData();
      renderAll();
      setupEvents();
    });

    async function loadInitialData() {
      const localData = localStorage.getItem("webtoon_data");
      if (localData) {
        webtoonData = JSON.parse(localData);
      } else {
        // Fetch from system default
        try {
          const res = await fetch("./webtoon_data.json");
          webtoonData = await res.json();
        } catch (e) {
          console.error("Default data fetch error, loading scratch structure", e);
          webtoonData = {
            title: "대항해시대: 푸른 심연의 부름",
            cuts: []
          };
        }
      }
      document.getElementById("project-title").value = webtoonData.title || "";
    }

    function saveToLocal() {
      webtoonData.title = document.getElementById("project-title").value;
      localStorage.setItem("webtoon_data", JSON.stringify(webtoonData));
    }

    function setupEvents() {
      // General Header Buttons
      document.getElementById("project-title").addEventListener("input", saveToLocal);
      
      document.getElementById("btn-reset-default").addEventListener("click", async () => {
        if (confirm("모든 편집 내용이 소실됩니다. 기본 설정값으로 복구하시겠습니까?")) {
          localStorage.removeItem("webtoon_data");
          await loadInitialData();
          state.currentCutIndex = 0;
          state.selectedBubbleId = null;
          renderAll();
        }
      });

      document.getElementById("btn-import").addEventListener("click", () => {
        document.getElementById("file-import").click();
      });

      document.getElementById("file-import").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            webtoonData = JSON.parse(event.target.result);
            document.getElementById("project-title").value = webtoonData.title || "";
            state.currentCutIndex = 0;
            state.selectedBubbleId = null;
            saveToLocal();
            renderAll();
            alert("프로젝트 JSON 설정을 정상적으로 가져왔습니다.");
          } catch (err) {
            alert("불러오기 실패: 올바른 JSON 포맷 파일이 아닙니다.");
          }
        };
        reader.readAsText(file);
      });

      document.getElementById("btn-export").addEventListener("click", () => {
        saveToLocal();
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(webtoonData, null, 2));
        const dlAnchorElem = document.createElement('a');
        dlAnchorElem.setAttribute("href", dataStr);
        dlAnchorElem.setAttribute("download", `webtoon_data_${Date.now()}.json`);
        dlAnchorElem.click();
      });

      document.getElementById("btn-preview").addEventListener("click", () => {
        saveToLocal();
        window.open("viewer.html", "_blank");
      });

      // Cut Configuration Events
      document.getElementById("cut-bg-select").addEventListener("change", (e) => {
        const cut = webtoonData.cuts[state.currentCutIndex];
        cut.backgroundImage = e.target.value;
        saveToLocal();
        renderCanvas();
        updateCutListUI();
      });

      document.getElementById("cut-duration").addEventListener("input", (e) => {
        const cut = webtoonData.cuts[state.currentCutIndex];
        cut.duration = parseInt(e.target.value) || 5000;
        document.getElementById("timeline-duration-display").textContent = `Duration: ${(cut.duration / 1000).toFixed(1)}s`;
        saveToLocal();
        renderTimeline();
      });

      // Camera Inputs Events
      const camInputs = ["cam-start-scale", "cam-end-scale", "cam-start-x", "cam-start-y", "cam-end-x", "cam-end-y", "cam-start-time", "cam-duration"];
      camInputs.forEach(id => {
        document.getElementById(id).addEventListener("input", () => {
          const cut = webtoonData.cuts[state.currentCutIndex];
          if (!cut.camera) cut.camera = {};
          
          cut.camera.startScale = parseFloat(document.getElementById("cam-start-scale").value) || 1.0;
          cut.camera.endScale = parseFloat(document.getElementById("cam-end-scale").value) || 1.0;
          cut.camera.startX = parseInt(document.getElementById("cam-start-x").value) || 0;
          cut.camera.startY = parseInt(document.getElementById("cam-start-y").value) || 0;
          cut.camera.endX = parseInt(document.getElementById("cam-end-x").value) || 0;
          cut.camera.endY = parseInt(document.getElementById("cam-end-y").value) || 0;
          cut.camera.startTime = parseInt(document.getElementById("cam-start-time").value) || 0;
          cut.camera.duration = parseInt(document.getElementById("cam-duration").value) || 5000;

          saveToLocal();
          applyCameraPreview();
        });
      });

      // Add Element triggers
      document.getElementById("btn-add-cut").addEventListener("click", () => {
        const newId = webtoonData.cuts.length > 0 ? Math.max(...webtoonData.cuts.map(c => c.id)) + 1 : 1;
        const newCut = {
          id: newId,
          backgroundImage: "./자료/1.jpg",
          duration: 6000,
          camera: { startX: 0, startY: 0, startScale: 1.0, endX: -10, endY: -10, endScale: 1.1, startTime: 0, duration: 6000 },
          audios: [],
          bubbles: []
        };
        webtoonData.cuts.push(newCut);
        state.currentCutIndex = webtoonData.cuts.length - 1;
        state.selectedBubbleId = null;
        saveToLocal();
        renderAll();
      });

      document.getElementById("btn-add-audio").addEventListener("click", () => {
        const cut = webtoonData.cuts[state.currentCutIndex];
        const audioId = `audio_${Date.now()}`;
        cut.audios.push({
          id: audioId,
          src: "./자료/Uncharted Waters - 01 Opening.mp3",
          startTime: 0,
          loop: false,
          volume: 0.8,
          type: "sfx"
        });
        saveToLocal();
        renderAudios();
      });

      document.getElementById("btn-add-bubble").addEventListener("click", () => {
        const cut = webtoonData.cuts[state.currentCutIndex];
        const bubbleId = `b_${Date.now()}`;
        const newBubble = {
          id: bubbleId,
          text: "새로운 대사 입력",
          x: 30,
          y: 40,
          startTime: 1000,
          charInterval: 80,
          style: "modern",
          color: "#000000",
          backgroundColor: "#ffffff",
          borderColor: "#8b5cf6"
        };
        cut.bubbles.push(newBubble);
        state.selectedBubbleId = bubbleId;
        saveToLocal();
        renderCanvas();
        renderBubblesInspector();
        renderTimeline();
      });

      // Inspector Form Input Syncs
      const inspectFields = ["bubble-text", "bubble-start-time", "bubble-char-interval", "bubble-style", "bubble-color", "bubble-bg-color", "bubble-border-color", "bubble-x", "bubble-y"];
      inspectFields.forEach(id => {
        document.getElementById(id).addEventListener("input", () => {
          if (!state.selectedBubbleId) return;
          const bubble = findBubbleInCut(state.selectedBubbleId);
          if (!bubble) return;

          bubble.text = document.getElementById("bubble-text").value;
          bubble.startTime = parseInt(document.getElementById("bubble-start-time").value) || 0;
          bubble.charInterval = parseInt(document.getElementById("bubble-char-interval").value) || 50;
          bubble.style = document.getElementById("bubble-style").value;
          bubble.color = document.getElementById("bubble-color").value;
          bubble.backgroundColor = document.getElementById("bubble-bg-color").value;
          bubble.borderColor = document.getElementById("bubble-border-color").value;
          bubble.x = parseInt(document.getElementById("bubble-x").value) || 0;
          bubble.y = parseInt(document.getElementById("bubble-y").value) || 0;

          saveToLocal();
          renderCanvas();
          updateBubblePillsUI();
          renderTimeline();
        });
      });

      // Setup Bubble dragging on canvas
      const canvasContainer = document.getElementById("canvas-container");
      canvasContainer.addEventListener("mousedown", (e) => {
        const canvasBubble = e.target.closest(".canvas-bubble");
        if (!canvasBubble) return;

        state.isDraggingBubble = true;
        state.draggedBubbleEl = canvasBubble;
        state.selectedBubbleId = canvasBubble.dataset.id;
        
        const bubble = findBubbleInCut(state.selectedBubbleId);
        state.bubbleStartPctX = bubble.x;
        state.bubbleStartPctY = bubble.y;
        state.dragStartX = e.clientX;
        state.dragStartY = e.clientY;

        renderBubblesInspector();
        updateBubblePillsUI();
        renderTimeline();
        e.preventDefault();
      });

      window.addEventListener("mousemove", (e) => {
        if (!state.isDraggingBubble || !state.draggedBubbleEl) return;
        const rect = canvasContainer.getBoundingClientRect();
        
        const deltaX = e.clientX - state.dragStartX;
        const deltaY = e.clientY - state.dragStartY;

        const deltaPctX = (deltaX / rect.width) * 100;
        const deltaPctY = (deltaY / rect.height) * 100;

        let newX = Math.round(state.bubbleStartPctX + deltaPctX);
        let newY = Math.round(state.bubbleStartPctY + deltaPctY);

        // Clamp inside canvas limits
        newX = Math.min(90, Math.max(0, newX));
        newY = Math.min(92, Math.max(0, newY));

        const bubble = findBubbleInCut(state.selectedBubbleId);
        if (bubble) {
          bubble.x = newX;
          bubble.y = newY;
          
          document.getElementById("bubble-x").value = newX;
          document.getElementById("bubble-y").value = newY;
          
          state.draggedBubbleEl.style.left = `${newX}%`;
          state.draggedBubbleEl.style.top = `${newY}%`;
        }
      });

      window.addEventListener("mouseup", () => {
        if (state.isDraggingBubble) {
          state.isDraggingBubble = false;
          state.draggedBubbleEl = null;
          saveToLocal();
        }
      });
    }

    // Lookup helpers
    function findBubbleInCut(id) {
      const cut = webtoonData.cuts[state.currentCutIndex];
      return cut.bubbles.find(b => b.id === id);
    }

    // Multi rendering manager
    function renderAll() {
      updateCutListUI();
      renderCanvas();
      renderAudios();
      renderBubblesInspector();
      renderTimeline();
    }

    // Update Left Sidebar Cut UI list
    function updateCutListUI() {
      const cutUl = document.getElementById("cut-ul");
      cutUl.innerHTML = "";

      webtoonData.cuts.forEach((cut, idx) => {
        const li = document.createElement("li");
        li.className = `cut-card ${state.currentCutIndex === idx ? 'selected' : ''}`;
        
        li.addEventListener("click", (e) => {
          // Guard against button deletes
          if (e.target.closest(".cut-card-btn")) return;
          state.currentCutIndex = idx;
          state.selectedBubbleId = null;
          renderAll();
        });

        const info = document.createElement("div");
        info.className = "cut-card-info";
        
        const title = document.createElement("span");
        title.className = "cut-card-title";
        title.textContent = `CUT #${idx + 1}`;
        
        const dur = document.createElement("span");
        dur.className = "cut-card-duration";
        dur.textContent = `${(cut.duration / 1000).toFixed(1)}s`;
        
        info.appendChild(title);
        info.appendChild(dur);

        const thumb = document.createElement("div");
        thumb.className = "cut-thumbnail";
        if (cut.backgroundImage) {
          const img = document.createElement("img");
          img.src = cut.backgroundImage;
          thumb.appendChild(img);
        } else {
          thumb.innerHTML = '<span class="cut-thumbnail-placeholder">No Image</span>';
        }

        const actions = document.createElement("div");
        actions.className = "cut-card-actions";
        
        const upBtn = document.createElement("button");
        upBtn.className = "cut-card-btn";
        upBtn.title = "위로 이동";
        upBtn.innerHTML = '<span class="material-icons-round" style="font-size:0.9rem;">arrow_upward</span>';
        upBtn.addEventListener("click", () => {
          if (idx > 0) {
            const temp = webtoonData.cuts[idx];
            webtoonData.cuts[idx] = webtoonData.cuts[idx - 1];
            webtoonData.cuts[idx - 1] = temp;
            state.currentCutIndex = idx - 1;
            saveToLocal();
            renderAll();
          }
        });

        const downBtn = document.createElement("button");
        downBtn.className = "cut-card-btn";
        downBtn.title = "아래로 이동";
        downBtn.innerHTML = '<span class="material-icons-round" style="font-size:0.9rem;">arrow_downward</span>';
        downBtn.addEventListener("click", () => {
          if (idx < webtoonData.cuts.length - 1) {
            const temp = webtoonData.cuts[idx];
            webtoonData.cuts[idx] = webtoonData.cuts[idx + 1];
            webtoonData.cuts[idx + 1] = temp;
            state.currentCutIndex = idx + 1;
            saveToLocal();
            renderAll();
          }
        });

        const delBtn = document.createElement("button");
        delBtn.className = "cut-card-btn delete";
        delBtn.title = "삭제";
        delBtn.innerHTML = '<span class="material-icons-round" style="font-size:0.9rem;">delete</span>';
        delBtn.addEventListener("click", () => {
          if (confirm(`CUT #${idx + 1}을 삭제하시겠습니까?`)) {
            webtoonData.cuts.splice(idx, 1);
            state.currentCutIndex = Math.max(0, idx - 1);
            state.selectedBubbleId = null;
            saveToLocal();
            renderAll();
          }
        });

        actions.appendChild(upBtn);
        actions.appendChild(downBtn);
        actions.appendChild(delBtn);

        li.appendChild(info);
        li.appendChild(thumb);
        li.appendChild(actions);
        cutUl.appendChild(li);
      });
    }

    // Render Canvas panel
    function renderCanvas() {
      const cut = webtoonData.cuts[state.currentCutIndex];
      const canvasBg = document.getElementById("canvas-bg");
      const bubbleLayer = document.getElementById("canvas-bubble-layer");

      if (!cut) {
        canvasBg.src = "";
        bubbleLayer.innerHTML = "";
        return;
      }

      canvasBg.src = cut.backgroundImage;
      applyCameraPreview();

      // Set input properties based on cut settings
      document.getElementById("cut-bg-select").value = cut.backgroundImage;
      document.getElementById("cut-duration").value = cut.duration;
      document.getElementById("timeline-duration-display").textContent = `Duration: ${(cut.duration / 1000).toFixed(1)}s`;

      if (cut.camera) {
        document.getElementById("cam-start-scale").value = cut.camera.startScale || 1;
        document.getElementById("cam-end-scale").value = cut.camera.endScale || 1;
        document.getElementById("cam-start-x").value = cut.camera.startX || 0;
        document.getElementById("cam-start-y").value = cut.camera.startY || 0;
        document.getElementById("cam-end-x").value = cut.camera.endX || 0;
        document.getElementById("cam-end-y").value = cut.camera.endY || 0;
        document.getElementById("cam-start-time").value = cut.camera.startTime || 0;
        document.getElementById("cam-duration").value = cut.camera.duration || 5000;
      }

      // Clear previous bubbles
      bubbleLayer.innerHTML = "";

      // Draw active cut speech bubbles on editor preview
      cut.bubbles.forEach(bubble => {
        const bDiv = document.createElement("div");
        bDiv.className = `canvas-bubble style-${bubble.style} ${state.selectedBubbleId === bubble.id ? 'selected' : ''}`;
        bDiv.dataset.id = bubble.id;
        bDiv.style.left = `${bubble.x}%`;
        bDiv.style.top = `${bubble.y}%`;

        const bInner = document.createElement("div");
        bInner.className = "canvas-bubble-inner";
        bInner.textContent = bubble.text || "입력...";
        
        // Colors from bubble structure
        bInner.style.color = bubble.color || "#000";
        bInner.style.backgroundColor = bubble.backgroundColor || "#fff";
        bInner.style.borderColor = bubble.borderColor || "#000";

        bDiv.appendChild(bInner);
        bubbleLayer.appendChild(bDiv);
      });
    }

    function applyCameraPreview() {
      const cut = webtoonData.cuts[state.currentCutIndex];
      const canvasBg = document.getElementById("canvas-bg");
      if (!cut || !canvasBg || !cut.camera) return;

      // In editor preview, show starting camera bounds slightly to visually imply
      const cam = cut.camera;
      canvasBg.style.transform = `translate3d(${cam.startX}px, ${cam.startY}px, 0) scale(${cam.startScale})`;
    }

    // Render properties inspector for selected cut audios
    function renderAudios() {
      const cut = webtoonData.cuts[state.currentCutIndex];
      const container = document.getElementById("audio-list-container");
      container.innerHTML = "";

      if (!cut || !cut.audios || cut.audios.length === 0) {
        container.innerHTML = '<div style="font-size:0.75rem; color:var(--text-muted); text-align:center; padding:10px;">등록된 연출 오디오 없음</div>';
        return;
      }

      cut.audios.forEach((audio, idx) => {
        const item = document.createElement("div");
        item.className = "audio-item";

        const title = document.createElement("div");
        title.className = "audio-item-title";
        
        const typeBadge = document.createElement("span");
        typeBadge.style.color = audio.type === 'bgm' ? '#38bdf8' : '#fb923c';
        typeBadge.style.fontSize = '0.7rem';
        typeBadge.style.fontWeight = 'bold';
        typeBadge.textContent = audio.type.toUpperCase();
        
        const deleteAudioBtn = document.createElement("button");
        deleteAudioBtn.className = "cut-card-btn";
        deleteAudioBtn.title = "오디오 제거";
        deleteAudioBtn.innerHTML = '<span class="material-icons-round" style="font-size:0.95rem; color:#ef4444;">remove_circle</span>';
        deleteAudioBtn.addEventListener("click", () => {
          cut.audios.splice(idx, 1);
          saveToLocal();
          renderAudios();
        });

        title.appendChild(typeBadge);
        title.appendChild(deleteAudioBtn);

        // Path Selector Select
        const srcSelect = document.createElement("select");
        srcSelect.style.marginBottom = "6px";
        srcSelect.style.fontSize = "0.75rem";
        srcSelect.style.padding = "4px 8px";
        
        audioOptions.forEach(opt => {
          const optEl = document.createElement("option");
          optEl.value = opt.path;
          optEl.textContent = opt.label;
          srcSelect.appendChild(optEl);
        });
        srcSelect.value = audio.src;
        srcSelect.addEventListener("change", (e) => {
          audio.src = e.target.value;
          saveToLocal();
        });

        // Grid parameters
        const formG = document.createElement("div");
        formG.className = "form-group inline";
        formG.style.marginBottom = "0";

        const divStart = document.createElement("div");
        const lblStart = document.createElement("label");
        lblStart.textContent = "시작 시간(ms)";
        lblStart.style.fontSize = "0.7rem";
        const inputStart = document.createElement("input");
        inputStart.type = "number";
        inputStart.style.padding = "4px 8px";
        inputStart.style.fontSize = "0.75rem";
        inputStart.value = audio.startTime;
        inputStart.addEventListener("input", (e) => {
          audio.startTime = parseInt(e.target.value) || 0;
          saveToLocal();
        });
        divStart.appendChild(lblStart);
        divStart.appendChild(inputStart);

        const divVolType = document.createElement("div");
        const lblVolType = document.createElement("label");
        lblVolType.textContent = "타입/볼륨";
        lblVolType.style.fontSize = "0.7rem";
        
        const volSelectGroup = document.createElement("div");
        volSelectGroup.style.display = "flex";
        volSelectGroup.style.gap = "4px";
        
        const typeSelect = document.createElement("select");
        typeSelect.style.padding = "4px";
        typeSelect.style.fontSize = "0.75rem";
        typeSelect.innerHTML = '<option value="sfx">SFX</option><option value="bgm">BGM</option>';
        typeSelect.value = audio.type;
        typeSelect.addEventListener("change", (e) => {
          audio.type = e.target.value;
          saveToLocal();
          renderAudios(); // rerender list to update type title
        });

        const inputVol = document.createElement("input");
        inputVol.type = "number";
        inputVol.step = "0.1";
        inputVol.min = "0";
        inputVol.max = "1";
        inputVol.style.padding = "4px";
        inputVol.style.fontSize = "0.75rem";
        inputVol.value = audio.volume;
        inputVol.addEventListener("input", (e) => {
          audio.volume = parseFloat(e.target.value) || 0.8;
          saveToLocal();
        });

        volSelectGroup.appendChild(typeSelect);
        volSelectGroup.appendChild(inputVol);
        divVolType.appendChild(lblVolType);
        divVolType.appendChild(volSelectGroup);

        formG.appendChild(divStart);
        formG.appendChild(divVolType);

        const loopCheckRow = document.createElement("div");
        loopCheckRow.style.marginTop = "6px";
        loopCheckRow.style.display = "flex";
        loopCheckRow.style.alignItems = "center";
        loopCheckRow.style.gap = "6px";
        const chk = document.createElement("input");
        chk.type = "checkbox";
        chk.style.width = "auto";
        chk.checked = audio.loop || false;
        chk.addEventListener("change", (e) => {
          audio.loop = e.target.checked;
          saveToLocal();
        });
        const chkLbl = document.createElement("label");
        chkLbl.textContent = "오디오 무한 루프 반복";
        chkLbl.style.marginBottom = "0";
        loopCheckRow.appendChild(chk);
        loopCheckRow.appendChild(chkLbl);

        item.appendChild(title);
        item.appendChild(srcSelect);
        item.appendChild(formG);
        item.appendChild(loopCheckRow);
        container.appendChild(item);
      });
    }

    // Render bubble listing sidebar selector
    function renderBubblesInspector() {
      updateBubblePillsUI();

      const inspector = document.getElementById("bubble-inspector");
      if (!state.selectedBubbleId) {
        inspector.style.display = "none";
        return;
      }

      inspector.style.display = "block";
      const bubble = findBubbleInCut(state.selectedBubbleId);
      if (!bubble) return;

      document.getElementById("bubble-text").value = bubble.text;
      document.getElementById("bubble-start-time").value = bubble.startTime;
      document.getElementById("bubble-char-interval").value = bubble.charInterval;
      document.getElementById("bubble-style").value = bubble.style;
      document.getElementById("bubble-color").value = bubble.color;
      document.getElementById("bubble-bg-color").value = bubble.backgroundColor;
      document.getElementById("bubble-border-color").value = bubble.borderColor;
      document.getElementById("bubble-x").value = bubble.x;
      document.getElementById("bubble-y").value = bubble.y;
    }

    function updateBubblePillsUI() {
      const cut = webtoonData.cuts[state.currentCutIndex];
      const container = document.getElementById("bubbles-pills-list");
      container.innerHTML = "";

      if (!cut || !cut.bubbles || cut.bubbles.length === 0) {
        container.innerHTML = '<div style="font-size:0.75rem; color:var(--text-muted); text-align:center; padding:10px;">등록된 말풍선이 없습니다</div>';
        return;
      }

      cut.bubbles.forEach((bubble) => {
        const item = document.createElement("div");
        item.className = `bubble-pill-item ${state.selectedBubbleId === bubble.id ? 'selected' : ''}`;
        
        item.addEventListener("click", () => {
          state.selectedBubbleId = bubble.id;
          renderCanvas();
          renderBubblesInspector();
          renderTimeline();
        });

        const label = document.createElement("span");
        label.className = "bubble-pill-text";
        label.textContent = `[${bubble.style.toUpperCase()}] ${bubble.text}`;

        const acts = document.createElement("div");
        acts.className = "bubble-pill-actions";

        const del = document.createElement("button");
        del.className = "cut-card-btn";
        del.title = "말풍선 삭제";
        del.innerHTML = '<span class="material-icons-round" style="font-size:0.95rem; color:#ef4444;">delete</span>';
        del.addEventListener("click", (e) => {
          e.stopPropagation(); // prevent select trigger
          if (confirm("이 말풍선을 정말 삭제하시겠습니까?")) {
            const index = cut.bubbles.findIndex(b => b.id === bubble.id);
            cut.bubbles.splice(index, 1);
            if (state.selectedBubbleId === bubble.id) state.selectedBubbleId = null;
            saveToLocal();
            renderCanvas();
            renderBubblesInspector();
            renderTimeline();
          }
        });

        acts.appendChild(del);
        item.appendChild(label);
        item.appendChild(acts);
        container.appendChild(item);
      });
    }

    // Render horizontal timeline markers inside editor
    function renderTimeline() {
      const timelineTrack = document.getElementById("timeline-track");
      timelineTrack.innerHTML = "";

      const cut = webtoonData.cuts[state.currentCutIndex];
      if (!cut) return;

      const duration = cut.duration || 5000;

      cut.bubbles.forEach(bubble => {
        const marker = document.createElement("div");
        marker.className = `timeline-marker ${state.selectedBubbleId === bubble.id ? 'selected' : ''}`;
        
        const progress = (bubble.startTime / duration) * 100;
        marker.style.left = `${Math.min(100, Math.max(0, progress))}%`;
        marker.title = `[말풍선 등장] ${bubble.text}`;

        // Timeline marker select
        marker.addEventListener("mousedown", (e) => {
          e.stopPropagation();
          state.selectedBubbleId = bubble.id;
          renderCanvas();
          renderBubblesInspector();
          updateBubblePillsUI();
          
          let startX = e.clientX;
          let originalStartVal = bubble.startTime;

          const onMouseMove = (moveEvent) => {
            const trackRect = timelineTrack.getBoundingClientRect();
            const deltaX = moveEvent.clientX - startX;
            const deltaPercent = deltaX / trackRect.width;
            let newTimeVal = Math.round(originalStartVal + deltaPercent * duration);
            
            // Clamp marker times inside bounds
            newTimeVal = Math.min(duration - 200, Math.max(0, newTimeVal));
            
            bubble.startTime = newTimeVal;
            marker.style.left = `${(newTimeVal / duration) * 100}%`;

            // Update inputs
            document.getElementById("bubble-start-time").value = newTimeVal;
          };

          const onMouseUp = () => {
            window.removeEventListener("mousemove", onMouseMove);
            window.removeEventListener("mouseup", onMouseUp);
            saveToLocal();
            renderTimeline();
          };

          window.addEventListener("mousemove", onMouseMove);
          window.addEventListener("mouseup", onMouseUp);
        });

        timelineTrack.appendChild(marker);
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모션 웹툰 뷰어 (Motion Webtoon Viewer)</title>
  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0b0e;
      --panel-bg: rgba(20, 22, 30, 0.75);
      --panel-border: rgba(255, 255, 255, 0.08);
      --accent: #8b5cf6;
      --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 100%);
      --accent-glow: rgba(139, 92, 246, 0.4);
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: 'Noto Sans KR', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Screen Wrapper: Locks webtoon inside standard comic aspect ratio */
    #screen-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 560px; /* Standard webtoon mobile width */
      max-height: 900px;
      aspect-ratio: 9 / 16;
      background: #000;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 40px rgba(139, 92, 246, 0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
    }

    /* Viewport containing cut imagery and speech bubbles */
    #webtoon-viewport {
      position: relative;
      width: 100%;
      flex-grow: 1;
      overflow: hidden;
      background: #000;
    }

    .bg-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #cut-background {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
      will-change: transform;
    }

    /* Speech Bubble Overlay Layer */
    .bubble-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    /* Bubble structural layout */
    .bubble-wrapper {
      position: absolute;
      pointer-events: auto;
      opacity: 0;
      transform: scale(0.4);
      transform-origin: center center;
    }

    /* CSS POP KEYFRAME ANIMATION - Separate from typing */
    @keyframes bubble-pop {
      0% {
        transform: scale(0.4);
        opacity: 0;
      }
      60% {
        transform: scale(1.1);
        opacity: 1;
      }
      85% {
        transform: scale(0.95);
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .bubble-wrapper.active {
      animation: bubble-pop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.2) forwards;
    }

    /* Bubble background styles (Visual frame) */
    .bubble-bg-layer {
      position: relative;
      padding: 14px 20px;
      border-radius: 18px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      min-width: 100px;
      max-width: 260px;
      border-width: 2px;
      border-style: solid;
      line-height: 1.5;
      font-size: 1rem;
      font-weight: 500;
      color: transparent !important; /* Hide original layout text */
      word-break: keep-all;
    }

    /* Bubble text layer (Physically separated from frame) */
    .bubble-text-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 500;
      line-height: 1.5;
      word-break: keep-all;
      pointer-events: none;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
    }

    /* Character span overrides */
    .bubble-text-layer span {
      display: inline-block;
      white-space: pre-wrap;
      opacity: 0;
      /* ABSOLUTELY EXCLUDE CSS TRANSITIONS */
      transition: none !important;
    }

    /* Theme Styles for Bubble Frames */
    .bubble-style-thought .bubble-bg-layer {
      border-radius: 30px;
    }
    .bubble-style-thought .bubble-bg-layer::after,
    .bubble-style-thought .bubble-bg-layer::before {
      content: '';
      position: absolute;
      background: inherit;
      border: inherit;
      border-radius: 50%;
    }
    .bubble-style-thought .bubble-bg-layer::after {
      width: 16px;
      height: 16px;
      bottom: -10px;
      left: 20%;
    }
    .bubble-style-thought .bubble-bg-layer::before {
      width: 8px;
      height: 8px;
      bottom: -16px;
      left: 15%;
    }

    .bubble-style-shout .bubble-bg-layer {
      font-weight: 700;
      clip-path: polygon(
        0% 15%, 12% 10%, 15% 0%, 25% 8%, 38% 3%, 45% 10%, 60% 0%, 65% 12%, 80% 5%, 85% 14%, 96% 8%, 92% 28%, 100% 40%, 91% 52%, 98% 70%, 86% 75%, 88% 94%, 73% 85%, 60% 98%, 52% 86%, 35% 92%, 30% 80%, 15% 90%, 18% 72%, 5% 75%, 8% 55%, 0% 45%, 9% 30%
      );
      padding: 24px 28px;
      border: none !important; /* Clip path clips borders, so background handles style */
    }
    .bubble-style-shout .bubble-text-layer {
      padding: 24px 28px;
      font-weight: 700;
    }

    .bubble-style-modern .bubble-bg-layer {
      border-radius: 12px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }
    .bubble-style-modern .bubble-bg-layer::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 24px;
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 8px solid var(--accent); /* will fall back or resolve dynamic border */
      border-top-color: inherit;
    }

    .bubble-style-retro .bubble-bg-layer {
      border-radius: 0px;
      border-width: 4px;
      box-shadow: 6px 6px 0px #000;
    }
    .bubble-style-retro .bubble-bg-layer::after {
      content: '';
      position: absolute;
      bottom: -16px;
      left: 20px;
      width: 16px;
      height: 16px;
      background: inherit;
      border: inherit;
      border-top: none;
      border-right: none;
      transform: rotate(-45deg);
      transform-origin: top left;
    }

    /* Timeline & Control Panel Dashboard */
    #dashboard {
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--panel-border);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
    }

    /* Time scrub progress bar container */
    .scrub-container {
      position: relative;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
    }
    .scrub-container:hover .scrub-handle {
      transform: scale(1.3);
    }
    .scrub-progress {
      height: 100%;
      background: var(--accent-gradient);
      border-radius: 3px;
      width: 0%;
      pointer-events: none;
    }
    .scrub-handle {
      position: absolute;
      left: 0%;
      width: 12px;
      height: 12px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent);
      transform: translateX(-50%);
      transition: transform 0.1s ease;
      pointer-events: none;
    }

    /* Bubble tick marks on timeline */
    .bubble-tick {
      position: absolute;
      width: 4px;
      height: 12px;
      background: #06b6d4;
      top: -3px;
      border-radius: 2px;
      opacity: 0.7;
      transform: translateX(-200%);
    }

    /* Control Button Row */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-light);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .control-btn:hover {
      background: var(--accent-gradient);
      border-color: transparent;
      box-shadow: 0 0 15px var(--accent-glow);
      transform: translateY(-2px);
    }
    .control-btn:active {
      transform: translateY(0);
    }

    .cut-indicator {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      font-family: 'Outfit', sans-serif;
    }

    .cut-time-display {
      font-size: 0.8rem;
      font-family: 'Outfit', sans-serif;
      color: var(--text-muted);
    }

    /* Sound Volume bar */
    .volume-container {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
    }
    .volume-slider {
      width: 70px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.15);
      height: 4px;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-light);
    }

    /* State Lock Landing Screen Overlay */
    #lock-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1b1330 0%, #07070b 100%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
    }

    #lock-screen.unlocked {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .lock-logo {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 2.2rem;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #c084fc 0%, #22d3ee 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.3));
    }

    .lock-subtitle {
      font-size: 1.1rem;
      color: var(--text-light);
      font-weight: 600;
      margin-bottom: 24px;
      word-break: keep-all;
    }

    .lock-description {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 40px;
      line-height: 1.6;
      word-break: keep-all;
    }

    .start-btn {
      position: relative;
      background: var(--accent-gradient);
      color: white;
      padding: 16px 42px;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 10px 30px var(--accent-glow);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .start-btn::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      border-radius: 32px;
      background: var(--accent-gradient);
      z-index: -1;
      filter: blur(8px);
      opacity: 0.7;
    }

    .start-btn:hover {
      transform: scale(1.05) translateY(-3px);
      box-shadow: 0 15px 35px var(--accent-glow);
    }
    .start-btn:active {
      transform: scale(0.98) translateY(0);
    }

    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px solid var(--accent);
      border-radius: 32px;
      animation: pulse-ring-anim 2s infinite;
      z-index: -1;
    }

    @keyframes pulse-ring-anim {
      0% {
        transform: scale(0.95);
        opacity: 0.8;
      }
      100% {
        transform: scale(1.3);
        opacity: 0;
      }
    }

    /* Finished End Screen Overlay */
    #end-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 11, 14, 0.95);
      z-index: 50;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }
    #end-screen.visible {
      display: flex;
    }
    .end-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
    }
    .replay-btn {
      background: var(--accent-gradient);
      border: none;
      color: #fff;
      padding: 12px 28px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.2s ease;
    }
    .replay-btn:hover {
      transform: translateY(-2px);
    }

    /* Floating editor return link */
    .editor-link {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(10, 11, 14, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-light);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 90;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }
    .editor-link:hover {
      background: var(--text-light);
      color: var(--bg-dark);
      border-color: #fff;
    }
  </style>
</head>
<body>

  <div id="screen-wrapper">
    
    <!-- State Lock Screen Overlay -->
    <div id="lock-screen">
      <div class="lock-logo">NAVIGATOR</div>
      <div class="lock-subtitle" id="webtoon-title-lock">대항해시대: 푸른 심연의 부름</div>
      <p class="lock-description">
        본 연출은 사운드, 모션 카메라, 말풍선 타이핑 연출이<br>
        실시간 타임라인으로 결합된 모션 웹툰입니다.<br>
        소리를 켜고 아래 감상하기 버튼을 클릭해 주세요.
      </p>
      <button class="start-btn" id="btn-start">
        <span class="material-icons-round">play_arrow</span>
        감상 시작하기
        <div class="pulse-ring"></div>
      </button>
    </div>

    <!-- Quick editor link -->
    <a href="index.html" class="editor-link">
      <span class="material-icons-round">edit</span>
      편집기로 이동
    </a>

    <!-- Render viewport -->
    <div id="webtoon-viewport">
      <!-- Cut rendering layout created dynamically -->
    </div>

    <!-- End screen overlay -->
    <div id="end-screen">
      <div class="end-title">감상이 완료되었습니다.</div>
      <button class="replay-btn" id="btn-replay">
        <span class="material-icons-round">replay</span>
        처음부터 다시 보기
      </button>
    </div>

    <!-- Control panel -->
    <div id="dashboard">
      <!-- Scrub Bar -->
      <div class="scrub-container" id="scrub-bar">
        <div class="scrub-progress" id="scrub-progress"></div>
        <div class="scrub-handle" id="scrub-handle"></div>
        <!-- Bubble timing ticks will render here dynamically -->
        <div id="ticks-container"></div>
      </div>

      <!-- Controls Row -->
      <div class="controls-row">
        <div class="btn-group">
          <button class="control-btn" id="btn-prev" title="이전 컷">
            <span class="material-icons-round">skip_previous</span>
          </button>
          <button class="control-btn" id="btn-play-pause" title="재생/일시정지">
            <span class="material-icons-round" id="play-pause-icon">pause</span>
          </button>
          <button class="control-btn" id="btn-next" title="다음 컷">
            <span class="material-icons-round">skip_next</span>
          </button>
          <span class="cut-indicator" id="cut-number-display">CUT 1 / 3</span>
        </div>

        <div class="cut-time-display" id="cut-time-display">0.0s / 0.0s</div>

        <div class="volume-container">
          <span class="material-icons-round" id="volume-icon" style="font-size: 1.2rem;">volume_up</span>
          <input type="range" class="volume-slider" id="vol-slider" min="0" max="1" step="0.05" value="0.5">
        </div>
      </div>
    </div>

  </div>

  <script>
    // System Data & States
    let webtoonData = null;
    
    const state = {
      currentCutIndex: 0,
      cutElapsed: 0,            // Time in ms elapsed inside the current cut
      isPlaying: false,          // Controls playback timeline tick
      isStateLocked: true,       // Controls state lock guard
      globalVolume: 0.5,
      playedAudios: new Set()    // Audio IDs triggered in the current cut
    };

    // Engine loop tracking variables
    let animationFrameId = null;
    let cutStartTime = 0;        // Timestamp when current cut started (performance.now() adjusted)
    let pausedElapsed = 0;       // Buffer to keep track of elapsed duration when paused
    let activeAudios = [];       // Track playing audio instances for teardown

    // DOM Elements
    const lockScreen = document.getElementById("lock-screen");
    const webtoonViewport = document.getElementById("webtoon-viewport");
    const scrubBar = document.getElementById("scrub-bar");
    const scrubProgress = document.getElementById("scrub-progress");
    const scrubHandle = document.getElementById("scrub-handle");
    const ticksContainer = document.getElementById("ticks-container");
    const btnPlayPause = document.getElementById("btn-play-pause");
    const playPauseIcon = document.getElementById("play-pause-icon");
    const btnPrev = document.getElementById("btn-prev");
    const btnNext = document.getElementById("btn-next");
    const btnStart = document.getElementById("btn-start");
    const btnReplay = document.getElementById("btn-replay");
    const endScreen = document.getElementById("end-screen");
    const cutNumberDisplay = document.getElementById("cut-number-display");
    const cutTimeDisplay = document.getElementById("cut-time-display");
    const volSlider = document.getElementById("vol-slider");
    const volumeIcon = document.getElementById("volume-icon");
    const webtoonTitleLock = document.getElementById("webtoon-title-lock");

    // Initialize application
    window.addEventListener("DOMContentLoaded", async () => {
      await loadData();
      setupEvents();
    });

    // Load webtoon configurations from localStorage or default webtoon_data.json
    async function loadData() {
      try {
        const localConfig = localStorage.getItem("webtoon_data");
        if (localConfig) {
          webtoonData = JSON.parse(localConfig);
          console.log("Loaded configuration from localStorage");
        } else {
          const res = await fetch("./webtoon_data.json");
          webtoonData = await res.json();
          console.log("Loaded default configuration from file");
        }
      } catch (err) {
        console.error("Failed to load webtoon configuration:", err);
        // Fallback dummy database just in case
        webtoonData = {
          title: "연결 오류 - 기본 데이터 로드 실패",
          cuts: [{
            id: 1,
            backgroundImage: "",
            duration: 5000,
            camera: { startX:0, startY:0, startScale:1, endX:0, endY:0, endScale:1, startTime:0, duration:5000 },
            audios: [],
            bubbles: [{ id: "fallback_b", text: "데이터를 로드하는 데 실패하였습니다.", x: 20, y: 40, startTime: 500, charInterval: 100, style: "modern", color: "#f8fafc", backgroundColor: "rgba(220,38,38,0.9)", borderColor: "#ef4444" }]
          }]
        };
      }
      
      // Update splash display
      if (webtoonData.title) {
        webtoonTitleLock.textContent = webtoonData.title;
        document.title = `${webtoonData.title} - 모션 웹툰 뷰어`;
      }
    }

    function setupEvents() {
      // Start button clicks
      btnStart.addEventListener("click", () => {
        unlockState();
      });

      // Play & Pause
      btnPlayPause.addEventListener("click", togglePlay);

      // Prev & Next Cut
      btnPrev.addEventListener("click", () => {
        if (state.currentCutIndex > 0) {
          changeCut(state.currentCutIndex - 1);
        }
      });
      btnNext.addEventListener("click", () => {
        if (state.currentCutIndex < webtoonData.cuts.length - 1) {
          changeCut(state.currentCutIndex + 1);
        }
      });

      // Replay at end screen
      btnReplay.addEventListener("click", () => {
        endScreen.classList.remove("visible");
        changeCut(0);
        state.isPlaying = true;
        playPauseIcon.textContent = "pause";
        startLoop();
      });

      // Timeline Scrubbing
      scrubBar.addEventListener("click", (e) => {
        if (state.isStateLocked || !webtoonData) return;
        const rect = scrubBar.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const width = rect.width;
        let progress = clickX / width;
        progress = Math.min(1, Math.max(0, progress));
        
        scrubToProgress(progress);
      });

      // Volume slider change
      volSlider.addEventListener("input", (e) => {
        state.globalVolume = parseFloat(e.target.value);
        updateVolume();
      });
    }

    // Unlocks State lock: Allows audio and ticking to execute
    function unlockState() {
      state.isStateLocked = false;
      lockScreen.classList.add("unlocked");
      
      // Explicitly resume Audio Context to satisfy browser policies
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) {
        const dummyCtx = new AudioCtx();
        dummyCtx.resume();
      }

      state.isPlaying = true;
      playPauseIcon.textContent = "pause";
      
      // Load and start first cut
      changeCut(0);
      startLoop();
    }

    function togglePlay() {
      if (state.isStateLocked) return;
      
      state.isPlaying = !state.isPlaying;
      if (state.isPlaying) {
        playPauseIcon.textContent = "pause";
        // Calculate new start time based on previously accumulated elapsed duration
        cutStartTime = performance.now() - pausedElapsed;
        resumeAudios();
        animationFrameId = requestAnimationFrame(tick);
      } else {
        playPauseIcon.textContent = "play_arrow";
        // Buffer current elapsed progress
        pausedElapsed = state.cutElapsed;
        pauseAudios();
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
      }
    }

    function startLoop() {
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      cutStartTime = performance.now() - pausedElapsed;
      animationFrameId = requestAnimationFrame(tick);
    }

    // Unified requestAnimationFrame loop
    function tick(timestamp) {
      if (!state.isPlaying || state.isStateLocked) return;

      state.cutElapsed = timestamp - cutStartTime;
      const currentCut = webtoonData.cuts[state.currentCutIndex];

      // Check if cut has ended
      if (state.cutElapsed >= currentCut.duration) {
        if (state.currentCutIndex < webtoonData.cuts.length - 1) {
          changeCut(state.currentCutIndex + 1);
        } else {
          // Finished webtoon
          state.isPlaying = false;
          pauseAudios();
          endScreen.classList.add("visible");
          if (animationFrameId) cancelAnimationFrame(animationFrameId);
          return;
        }
      } else {
        // Run update timeline for this frames' elapsed tick
        updateFrame(currentCut, state.cutElapsed);
      }

      animationFrameId = requestAnimationFrame(tick);
    }

    // Data-binding: Update view solely based on timeline elapsed count
    function updateFrame(cut, elapsed) {
      // 1. Render camera movement
      const camera = cut.camera;
      if (camera && elapsed >= camera.startTime) {
        const camElapsed = elapsed - camera.startTime;
        const progress = Math.min(1, Math.max(0, camElapsed / camera.duration));
        
        // Linear interpolation formula
        const currentX = camera.startX + (camera.endX - camera.startX) * progress;
        const currentY = camera.startY + (camera.endY - camera.startY) * progress;
        const currentScale = camera.startScale + (camera.endScale - camera.startScale) * progress;

        const bgImg = document.getElementById("cut-background");
        if (bgImg) {
          bgImg.style.transform = `translate3d(${currentX}px, ${currentY}px, 0) scale(${currentScale})`;
        }
      }

      // 2. Render speech bubbles & typing animation state
      cut.bubbles.forEach(bubble => {
        const wrapper = document.getElementById(bubble.id);
        if (!wrapper) return;

        if (elapsed >= bubble.startTime) {
          // Add entrance pop class (CSS keyframe trigger)
          if (!wrapper.classList.contains("active")) {
            wrapper.classList.add("active");
          }

          // Calculate characters to reveal (JS Direct typing control)
          const textElapsed = elapsed - bubble.startTime;
          const charsToReveal = Math.floor(textElapsed / bubble.charInterval);

          const textLayer = wrapper.querySelector(".bubble-text-layer");
          if (textLayer) {
            const spans = textLayer.children;
            for (let i = 0; i < spans.length; i++) {
              if (i < charsToReveal) {
                spans[i].style.opacity = "1";
              } else {
                spans[i].style.opacity = "0";
              }
            }
          }
        } else {
          // If timeline was scrubbed backward, hide bubbles
          wrapper.classList.remove("active");
          const textLayer = wrapper.querySelector(".bubble-text-layer");
          if (textLayer) {
            const spans = textLayer.children;
            for (let i = 0; i < spans.length; i++) {
              spans[i].style.opacity = "0";
            }
          }
        }
      });

      // 3. Audio Triggers
      cut.audios.forEach(audioData => {
        if (elapsed >= audioData.startTime && !state.playedAudios.has(audioData.id)) {
          state.playedAudios.add(audioData.id);
          const startOffset = (elapsed - audioData.startTime) / 1000;
          playAudioInstance(audioData, startOffset);
        }
      });

      // 4. Update Dashboard displays
      const progressPercent = Math.min(100, Math.max(0, (elapsed / cut.duration) * 100));
      scrubProgress.style.width = `${progressPercent}%`;
      scrubHandle.style.left = `${progressPercent}%`;
      
      const currentSec = (elapsed / 1000).toFixed(1);
      const totalSec = (cut.duration / 1000).toFixed(1);
      cutTimeDisplay.textContent = `${currentSec}s / ${totalSec}s`;
    }

    // Play an audio element and sync start offsets
    function playAudioInstance(audioData, startOffset = 0) {
      const audio = new Audio(audioData.src);
      audio.loop = audioData.loop || false;
      audio.volume = (audioData.volume !== undefined ? audioData.volume : 0.8) * state.globalVolume;
      
      // Store in tracking array for cleanup
      const audioObj = { id: audioData.id, element: audio, startTime: audioData.startTime };
      activeAudios.push(audioObj);

      // Play audio sync
      if (startOffset > 0 && !audioData.loop) {
        audio.currentTime = startOffset;
      }
      
      audio.play().catch(err => {
        console.warn(`Audio play blocked or missing files for: ${audioData.src}. It will play once browser is interacting.`, err);
      });
    }

    // Audio volume updates
    function updateVolume() {
      activeAudios.forEach(audioObj => {
        // Find configuration to map base volume
        const currentCut = webtoonData.cuts[state.currentCutIndex];
        const audioConf = currentCut.audios.find(a => a.id === audioObj.id);
        const baseVolume = audioConf ? (audioConf.volume !== undefined ? audioConf.volume : 0.8) : 0.8;
        
        audioObj.element.volume = baseVolume * state.globalVolume;
      });

      if (state.globalVolume === 0) {
        volumeIcon.textContent = "volume_off";
      } else if (state.globalVolume < 0.4) {
        volumeIcon.textContent = "volume_down";
      } else {
        volumeIcon.textContent = "volume_up";
      }
    }

    function pauseAudios() {
      activeAudios.forEach(audio => audio.element.pause());
    }

    function resumeAudios() {
      activeAudios.forEach(audio => {
        audio.element.play().catch(e => console.warn(e));
      });
    }

    // Physical Teardown / Cleanup Lifecycle
    function cleanupCurrentCut() {
      // 1. Physically pause and release Audio Elements
      activeAudios.forEach(audioObj => {
        audioObj.element.pause();
        audioObj.element.src = "";
        audioObj.element.load();
        audioObj.element = null;
      });
      activeAudios = [];
      state.playedAudios.clear();

      // 2. Clear out all nodes & bindings in viewport to prevent leaks
      if (webtoonViewport) {
        // replaceChildren is extremely clean and destroys references
        webtoonViewport.replaceChildren();
      }
    }

    // Renders the static structural shells for a new cut
    function renderCutFramework(cut) {
      // 1. Render Background Image Container
      const bgContainer = document.createElement("div");
      bgContainer.className = "bg-container";

      const bgImg = document.createElement("img");
      bgImg.id = "cut-background";
      bgImg.src = cut.backgroundImage;
      bgImg.alt = `Cut ${cut.id} Background`;
      
      // Set initial camera frame
      const cam = cut.camera;
      if (cam) {
        bgImg.style.transform = `translate3d(${cam.startX}px, ${cam.startY}px, 0) scale(${cam.startScale})`;
      }

      bgContainer.appendChild(bgImg);
      webtoonViewport.appendChild(bgContainer);

      // 2. Render Bubble Wrapper Structures
      const bubbleOverlay = document.createElement("div");
      bubbleOverlay.className = "bubble-overlay";

      cut.bubbles.forEach(bubble => {
        const wrapper = document.createElement("div");
        wrapper.id = bubble.id;
        wrapper.className = `bubble-wrapper bubble-style-${bubble.style}`;
        wrapper.style.left = `${bubble.x}%`;
        wrapper.style.top = `${bubble.y}%`;

        // Create Background Style layer
        const bgLayer = document.createElement("div");
        bgLayer.className = "bubble-bg-layer";
        bgLayer.textContent = bubble.text; // Keeps exact bounding size calculations
        
        // Dynamically apply design styling
        bgLayer.style.color = bubble.color || "#000";
        bgLayer.style.backgroundColor = bubble.backgroundColor || "#fff";
        bgLayer.style.borderColor = bubble.borderColor || "#000";

        // Create JS Typing layer (separate DOM layer)
        const textLayer = document.createElement("div");
        textLayer.className = "bubble-text-layer";
        textLayer.style.color = bubble.color || "#000";

        // Separate text elements to control with JS Loop
        const characters = Array.from(bubble.text);
        characters.forEach(char => {
          const span = document.createElement("span");
          span.textContent = char;
          textLayer.appendChild(span);
        });

        wrapper.appendChild(bgLayer);
        wrapper.appendChild(textLayer);
        bubbleOverlay.appendChild(wrapper);
      });

      webtoonViewport.appendChild(bubbleOverlay);

      // 3. Render Timeline Ticks for Speech Bubbles
      ticksContainer.replaceChildren();
      cut.bubbles.forEach(bubble => {
        const pct = (bubble.startTime / cut.duration) * 100;
        const tick = document.createElement("div");
        tick.className = "bubble-tick";
        tick.style.left = `${pct}%`;
        tick.title = `말풍선 노출 시작: ${(bubble.startTime / 1000).toFixed(1)}s`;
        ticksContainer.appendChild(tick);
      });
    }

    // Handles cut transition
    function changeCut(index) {
      cleanupCurrentCut();

      state.currentCutIndex = index;
      pausedElapsed = 0;
      state.cutElapsed = 0;
      
      const currentCut = webtoonData.cuts[state.currentCutIndex];
      renderCutFramework(currentCut);

      // Update control bar displays
      cutNumberDisplay.textContent = `CUT ${index + 1} / ${webtoonData.cuts.length}`;
      
      // Adjust skip buttons state
      btnPrev.disabled = index === 0;
      btnNext.disabled = index === webtoonData.cuts.length - 1;
      
      // Restart loop
      cutStartTime = performance.now();
    }

    // Timeline scrubbing logic
    function scrubToProgress(progress) {
      const currentCut = webtoonData.cuts[state.currentCutIndex];
      const targetElapsed = currentCut.duration * progress;

      // Adjust timelines
      pausedElapsed = targetElapsed;
      state.cutElapsed = targetElapsed;
      cutStartTime = performance.now() - targetElapsed;

      // Teardown active playing audios to re-sync
      activeAudios.forEach(audioObj => {
        audioObj.element.pause();
        audioObj.element = null;
      });
      activeAudios = [];
      state.playedAudios.clear();

      // Play audios that should be playing at this elapsed mark
      currentCut.audios.forEach(audioData => {
        if (targetElapsed >= audioData.startTime) {
          state.playedAudios.add(audioData.id);
          const elapsedInAudio = (targetElapsed - audioData.startTime) / 1000;
          
          if (audioData.loop) {
            // Loop audios play from the wrapped offset
            const dummyAudio = new Audio(audioData.src);
            dummyAudio.addEventListener("loadedmetadata", () => {
              const loopOffset = elapsedInAudio % dummyAudio.duration;
              playAudioInstance(audioData, loopOffset);
            });
          } else {
            // Sound effects play if target time is still within audio length range
            playAudioInstance(audioData, elapsedInAudio);
          }
        }
      });

      // Synchronize frame content instantly
      updateFrame(currentCut, targetElapsed);

      // Resume BGM/SFX sounds if system is playing
      if (!state.isPlaying) {
        pauseAudios();
      }
    }
  </script>
</body>
